<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>قهوة الطيبين · سباق السرعة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marhey:wght@500;700&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
/* Phone page for the speed race. Same colour tokens as the host screen, so a brand theme restyles both. */
:root{
  --night:#0d1423; --panel:#151f35;
  --line:rgba(240,231,212,.14); --line-strong:rgba(240,231,212,.38);
  --glow:rgba(43,84,184,.22);
  --enamel:#1e3f94; --enamel-edge:#ece4d2;
  --cream:#f0e7d4; --muted:#97a3bd;
  --brass:#e6b04a; --brass-deep:#a2741f; --brass-ink:#241904;
  --bad:#e8705f; --good:#5cc98f;
  --o0:#b42318; --o1:#175cd3; --o2:#a15c07; --o3:#067647;
  --team-ink:#15110a;
  --f-display:"Lalezar","Readex Pro",system-ui,Tahoma,sans-serif;
  --f-body:"Readex Pro",system-ui,"Segoe UI",Tahoma,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{
  background:radial-gradient(700px 360px at 50% -10%,var(--glow),transparent 70%),var(--night);background-color:var(--night);
  color:var(--cream);font-family:var(--f-body);font-size:17px;line-height:1.55;direction:rtl;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.app{
  max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;gap:16px;
  padding:max(14px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(18px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column;gap:0;min-width:0}
.logo{margin:0;font-family:var(--f-display);font-weight:400;font-size:1.7rem;line-height:1.1;color:var(--brass)}
.tag{margin:0;color:var(--muted);font-size:.9rem}
.brand::after{width:96px!important;height:9px!important;margin-top:6px!important}
.me{margin:0;color:var(--muted);font-size:.9rem;text-align:start;max-width:45%;overflow-wrap:anywhere}
.me b{color:var(--cream);font-weight:600}
.conn{position:sticky;top:8px;z-index:5;align-self:center;font-size:.85rem;padding:4px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line-strong);color:var(--muted)}
main{flex:1;display:flex;flex-direction:column}
.view{flex:1;display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px}
h1,h2{margin:0;font-family:var(--f-display);font-weight:400;line-height:1.25}
h1{font-size:1.9rem} h2{font-size:1.5rem}
label{font-size:.92rem;color:var(--muted)}
input{width:100%;background:var(--night);border:1px solid var(--line-strong);border-radius:12px;padding:12px 14px;font-size:1.15rem}
input:focus{outline:none;border-color:var(--brass)}
#in-code{font-family:var(--f-display);font-size:1.9rem;letter-spacing:.3em;text-align:center;direction:ltr;font-variant-numeric:tabular-nums}
.primary{
  font-family:var(--f-display);font-size:1.45rem;line-height:1;padding:15px 24px 13px;border-radius:14px;border:0;width:100%;
  background:var(--brass);color:var(--brass-ink);cursor:pointer;box-shadow:0 3px 0 var(--brass-deep);
}
.primary:active{transform:translateY(2px);box-shadow:0 1px 0 var(--brass-deep)}
.primary:disabled{opacity:.55}
.ghost{font-size:.95rem;padding:10px 16px;border-radius:12px;border:1px solid var(--line-strong);background:transparent;cursor:pointer}
.msg{margin:0;color:var(--muted);min-height:1.5em}
.msg.is-err{color:var(--bad)}
.center{text-align:center;align-items:center;justify-content:center}
.big-ico{font-size:3.2rem;line-height:1;margin:0}
.lead{margin:0;font-size:1.15rem}
.sub{margin:0;color:var(--muted)}

/* question */
.qmeta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:.92rem}
.qmeta b{color:var(--cream);font-weight:600}
.qtext{margin:0;font-weight:600;font-size:1.25rem;line-height:1.55;text-wrap:balance}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--brass);transform-origin:right center;transition:transform .12s linear}
.bar.warn i{background:var(--bad)}
.left{margin:-6px 0 0;color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.opts{display:grid;grid-template-columns:1fr;gap:10px}
#q-opts .buzzbtn{justify-self:center}
.opt{
  display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:12px 16px;border:0;border-radius:14px;cursor:pointer;
  background:var(--oc);color:#fff;text-align:start;font-size:1.12rem;font-weight:600;line-height:1.35;box-shadow:0 3px 0 rgba(0,0,0,.28);
}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.opt:disabled{opacity:.45;cursor:default}
.opt .sh{font-size:1.4rem;line-height:1;flex:none;width:1.4em;text-align:center}
.opt span:last-child{overflow-wrap:anywhere}
.chip{display:inline-flex;align-items:center;gap:10px;padding:10px 16px;border-radius:12px;background:var(--oc);color:#fff;font-weight:600;max-width:100%;overflow-wrap:anywhere}
.res-ok .big-ico,.res-ok .lead{color:var(--good)}
.res-bad .big-ico,.res-bad .lead{color:var(--bad)}
.pts{font-family:var(--f-display);font-size:2.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.answer{background:var(--night);border:1px solid var(--line);border-radius:12px;padding:10px 14px;width:100%}
.answer .sub{font-size:.85rem}
.answer strong{font-size:1.2rem;overflow-wrap:anywhere}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;width:100%}
.rank li{display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:12px;background:var(--night);border:1px solid var(--line)}
.rank li.mine{border-color:var(--brass)}
.rank .pos{font-family:var(--f-display);color:var(--muted);min-width:1.4em}
.rank .nm{flex:1;min-width:0;text-align:start;font-weight:600;overflow-wrap:anywhere}
.rank .p{font-family:var(--f-display);font-size:1.25rem;font-variant-numeric:tabular-nums}
.team-pick{display:grid;gap:10px}
.tp{display:block;width:100%;padding:16px 18px;border-radius:14px;border:0;background:var(--tc);color:var(--team-ink);font-weight:700;font-size:1.2rem;cursor:pointer;text-align:start;box-shadow:0 3px 0 rgba(0,0,0,.28)}
.tp:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.buzzbtn{align-self:center;width:min(72vw,280px);aspect-ratio:1;border-radius:50%;border:0;background:var(--tc);color:var(--team-ink);font-family:var(--f-display);font-size:2.6rem;cursor:pointer;margin:10px 0 4px;box-shadow:0 8px 0 rgba(0,0,0,.32),inset 0 0 0 8px rgba(255,255,255,.22);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.buzzbtn:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(0,0,0,.32),inset 0 0 0 8px rgba(255,255,255,.22)}
.buzzbtn:disabled{opacity:.6;transform:translateY(6px);box-shadow:0 2px 0 rgba(0,0,0,.32);cursor:default}
.rank li .dot{width:12px;height:12px;border-radius:50%;background:var(--tc);flex:none}
.tally{display:none}
.tally svg{display:block;height:24px;width:auto}
.big-ico svg{display:block;width:56px;height:56px;margin:0 auto}
.turnline{margin:0;text-align:center;font-size:1.15rem;font-weight:600;padding:10px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.turnline.mine{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
.pboard{display:flex;flex-direction:column;gap:7px}
.phelps{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px}
.help{font:inherit;font-weight:700;font-size:1rem;line-height:1.25;min-height:44px;padding:8px 18px;border-radius:999px;border:1.5px solid var(--brass);background:transparent;color:var(--brass);cursor:pointer}
.help.on,.help[aria-pressed="true"]{background:var(--brass);color:var(--brass-ink)}
.help.tgt{border-color:var(--tc);color:var(--tc)}
.help.tgt.on{background:var(--tc);color:var(--team-ink)}
.help:disabled{opacity:.6;cursor:default}
.help-for{color:var(--muted)}
#w-two,#b-two{align-self:center}
.prow{display:grid;grid-template-columns:minmax(0,1fr) repeat(5,minmax(38px,50px));gap:5px;align-items:stretch}
.pc{display:flex;align-items:center;font-weight:600;font-size:.95rem;line-height:1.3;overflow-wrap:anywhere;padding-inline-end:4px}
.pv{min-height:44px;border-radius:10px;border:1px solid var(--line-strong);background:transparent;color:var(--cream);font-family:var(--f-display);font-size:1.15rem;line-height:1;display:grid;place-items:center;padding:0;font-variant-numeric:tabular-nums}
button.pv:not(:disabled){background:var(--brass);color:var(--brass-ink);border-color:var(--brass);cursor:pointer;box-shadow:0 2px 0 var(--brass-deep)}
button.pv:not(:disabled):active{transform:translateY(2px);box-shadow:none}
button.pv:disabled{opacity:.75}
button.pv.sent{background:var(--cream);color:var(--night);opacity:1}
.pv.used{border-style:dashed;color:var(--muted);text-decoration:line-through;opacity:.6;position:relative}
.pv.used[style]::after{content:"";position:absolute;inset-block-start:4px;inset-inline-start:4px;width:7px;height:7px;border-radius:50%;background:var(--tc)}
.pv.none{border:0}
.center-t{text-align:center}
.brand-foot{margin:0;color:var(--muted);font-size:.8rem;text-align:center}
.brand-foot:empty{display:none}
@media (min-width:480px){ .opts{grid-template-columns:1fr 1fr} .opt{min-height:88px} }
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
/* the studio look, shared by every brand */
/* ===== the studio: a 90s TV game show =====
   Shared by the game screen and the phones of every brand. A sunburst stage, category signs ringed with bulbs,
   chunky yellow tiles, LED score podiums with a spotlight on the team whose turn it is, and a cream question card.
   A brand theme only sets the tokens below (and adds its own flourishes). */
:root{
  --stage:#0E3B43; --stage-ray:#124A53; --stage-dim:rgba(4,20,24,.55);
  --sign:#F2672E; --sign-deep:#B6461A; --sign-ink:#FFF4DC; --bulb:#FFE9A0; --bulb-glow:rgba(255,201,60,.5);
  --tile:#FFC93C; --tile-hi:#FFD964; --tile-lo:#F5B524; --tile-edge:#C7861A; --tile-ink:#10222A;
  --led:#10222A; --led-rim:#2B4A52; --led-ink:#FFC93C; --led-glow:rgba(255,201,60,.6);
  --hot:#D6336C; --hot-deep:#8E1F48; --hot-ink:#FFF4DC;
  --card:#FFF4DC; --card-ink:#10222A; --card-muted:#53646A; --card-line:rgba(16,34,42,.18); --field:#FFFFFF;
  --good:#2FB36B; --good-deep:#1B7A45; --on-good:#FFF4DC; --bad:#E0443A; --bad-deep:#9A2620; --on-bad:#FFF4DC;
  --wash:rgba(255,244,220,.07); --spot:rgba(255,233,160,.3);
  --confetti:#FFC93C,#F2672E,#D6336C,#FFF4DC,#4FA3E0,#3CC07A;
  --f-show:"Marhey","Lalezar","Readex Pro",system-ui,Tahoma,sans-serif;
  /* the older tokens the rest of the page uses */
  --night:#0A2E35; --panel:#0F3F47;
  --line:rgba(255,244,220,.16); --line-strong:rgba(255,244,220,.42); --glow:transparent;
  --cream:#FFF4DC; --muted:#A9D2CF;
  --brass:#FFC93C; --brass-deep:#C7861A; --brass-ink:#10222A;
  --team-ink:#10222A;
  --scrim:rgba(5,24,28,.9); --shadow:rgba(0,0,0,.35); --ring-track:rgba(255,244,220,.2);
  --f-display:var(--f-show);
}
body{
  background:
    radial-gradient(ellipse 120% 90% at 50% 105%,transparent 35%,var(--stage-dim) 100%),
    repeating-conic-gradient(from -3deg at 50% 110%,var(--stage) 0deg 6deg,var(--stage-ray) 6deg 12deg);
  background-color:var(--stage);background-attachment:fixed;
}
.ico{width:1.2em;height:1.2em;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---------- shared pieces ---------- */
.logo{font-family:var(--f-show);font-weight:700;color:var(--tile);text-shadow:0 4px 0 var(--sign-deep)}
.primary{
  font-family:var(--f-show);font-weight:700;border-radius:16px;
  background:linear-gradient(var(--tile-hi),var(--tile) 55%,var(--tile-lo));color:var(--tile-ink);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 6px 0 var(--tile-edge),0 10px 18px rgba(0,0,0,.25);
}
.primary:hover{filter:brightness(1.05)}
.primary:active{transform:translateY(4px);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 2px 0 var(--tile-edge)}
.ghost{border-radius:12px;border:2px solid var(--line-strong)}
.card{background:var(--panel);border:0;border-radius:22px;box-shadow:inset 0 0 0 2px var(--line),0 10px 24px rgba(0,0,0,.18)}
.card h2,h1,h2{font-family:var(--f-show);font-weight:700}
.card h2{color:var(--tile)}
.help{border-radius:12px;border-width:2px;font-family:var(--f-show);font-weight:700}
.help.on,.help[aria-pressed="true"]{box-shadow:0 4px 0 var(--tile-edge)}
.help.tgt.on{color:var(--team-ink)}

/* ---------- game screen: setup ---------- */
.modes{background:none;border:0;padding:0;gap:10px}
.mode{font-family:var(--f-show);font-weight:700;font-size:1.05rem;padding:9px 18px 10px;border-radius:14px;color:var(--cream);background:var(--wash);box-shadow:inset 0 0 0 2px var(--line)}
.mode .ico{width:22px;height:22px}
.mode.is-on{background:var(--hot);color:var(--hot-ink);box-shadow:0 5px 0 var(--hot-deep)}
.resume{background:var(--hot);color:var(--hot-ink);border-radius:18px;box-shadow:0 6px 0 var(--hot-deep)}
.resume .secondary{border-color:var(--hot-ink);color:var(--hot-ink);border-width:2px}
.team-row{gap:12px}
.swatch{width:22px;height:22px;box-shadow:0 0 0 3px var(--line-strong)}
.team-row input{background:var(--night);border:0;border-inline-start:8px solid var(--tc);border-radius:12px;font-weight:600;font-size:1.1rem;padding:10px 14px}
.team-row input:focus{box-shadow:0 0 0 3px var(--tc)}
.seg{background:var(--night);border:0;border-radius:14px;padding:4px}
.seg button{border-radius:10px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--tile);color:var(--tile-ink);box-shadow:0 3px 0 var(--tile-edge)}
.switch input{accent-color:var(--tile)}
.helps-note b{color:var(--tile)}
.cats{grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
.catpick{justify-content:flex-start;gap:10px;padding:9px 12px;border:0;border-radius:16px;background:var(--wash);box-shadow:inset 0 0 0 2px var(--line);color:var(--cream)}
.catpick .ico{width:34px;height:34px;padding:6px;border-radius:50%;background:var(--wash);box-shadow:inset 0 0 0 1.5px var(--line)}
.catpick .nm{flex:1;font-family:var(--f-body);font-weight:600;font-size:1.02rem}
.catpick:hover{box-shadow:inset 0 0 0 2px var(--line-strong)}
.catpick[aria-pressed="true"]{background:linear-gradient(var(--tile-hi),var(--tile) 55%,var(--tile-lo));color:var(--tile-ink);border:0;box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 5px 0 var(--tile-edge)}
.catpick[aria-pressed="true"] .ico{background:rgba(16,34,42,.1);box-shadow:none}
.catpick[aria-pressed="true"] .fresh{color:var(--tile-ink);opacity:.7}
.actions .primary{font-size:1.6rem;padding:17px 40px 15px}
.fest{border-inline-start-color:var(--tile)}

/* ---------- game screen: the board ---------- */
/* during a game the header shrinks and the board and podiums share one screen */
.app[data-scr="board"],.app[data-scr="feud"]{gap:12px;padding-block:12px 20px}
.app[data-scr="board"] .logo,.app[data-scr="feud"] .logo{font-size:clamp(1.6rem,2.6vw,2.2rem)}
.app[data-scr="board"] .tag,.app[data-scr="feud"] .tag{display:none}
.app[data-scr="board"] .cell{height:clamp(50px,calc((100dvh - 545px) / 5),118px)}
.app[data-scr="board"] .cat{min-height:clamp(64px,10.5vh,104px)}
.helps .help,.phelps .help{background:linear-gradient(var(--tile-hi),var(--tile) 55%,var(--tile-lo));color:var(--tile-ink);border:0;padding:7px 18px 8px;box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 4px 0 var(--tile-edge)}
.helps .help.on,.helps .help[aria-pressed="true"],.phelps .help.on,.phelps .help[aria-pressed="true"]{background:var(--hot);color:var(--hot-ink);box-shadow:0 0 0 3px var(--bulb),0 4px 0 var(--hot-deep)}
.turn{font-family:var(--f-show);font-weight:700;font-size:1.3rem;line-height:1.3;background:var(--hot);color:var(--hot-ink);padding:8px 24px 9px;border-radius:999px;box-shadow:0 5px 0 var(--hot-deep)}
.turn b{color:inherit}
.turn .dot{width:16px;height:16px;box-shadow:0 0 0 3px var(--hot-ink)}
.tools .ghost{border:0;background:none;color:var(--muted);padding:8px 10px}
.tools .ghost:hover{color:var(--cream)}
.board{gap:12px 14px}
.board-wrap{padding:10px 8px 12px}
.cat{
  min-height:clamp(78px,12vh,108px);flex-direction:column;gap:4px;padding:8px 6px;
  background:var(--sign);color:var(--sign-ink);border:5px dotted var(--bulb);border-radius:18px;
  box-shadow:0 0 0 4px var(--sign),0 0 22px var(--bulb-glow);
}
.cat-ico{width:clamp(22px,2.2vw,30px);height:clamp(22px,2.2vw,30px);stroke-width:2}
.cat-name{font-family:var(--f-show);font-weight:700;font-size:clamp(1rem,1.55vw,1.45rem);line-height:1.2;color:var(--sign-ink)}
button.cell{
  border-radius:16px;font-family:var(--f-show);font-weight:700;color:var(--tile-ink);
  background:linear-gradient(var(--tile-hi),var(--tile) 55%,var(--tile-lo));
  box-shadow:inset 0 3px 0 rgba(255,255,255,.55),0 8px 0 var(--tile-edge),0 12px 18px rgba(0,0,0,.28);
}
button.cell:hover{transform:translateY(-3px);filter:brightness(1.05)}
button.cell:active{transform:translateY(5px);box-shadow:inset 0 3px 0 rgba(255,255,255,.55),0 3px 0 var(--tile-edge)}
.cell.used{border-radius:16px;background:rgba(0,0,0,.24);box-shadow:inset 0 4px 10px rgba(0,0,0,.32);color:transparent}
.cell.used .v{display:none}
.cell .mark{display:none}
.cell.won{background:var(--tc);box-shadow:inset 0 3px 0 rgba(255,255,255,.28),0 5px 0 rgba(0,0,0,.28);transform:translateY(3px)}
.cell.won .v{display:block;opacity:.5;text-decoration:none;color:var(--team-ink);font-size:.62em}
.cell.empty{background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.board.deal .cat,.board.deal .cell{animation:deal .5s cubic-bezier(.2,1.35,.4,1) both;animation-delay:calc(var(--i,0) * 26ms)}
@keyframes deal{from{opacity:0;transform:translateY(-28px) scale(.85)}}

/* the scores: LED podiums, the spotlight on the team whose turn it is */
.scores{display:flex;flex-wrap:wrap;justify-content:center;gap:22px;padding-top:34px}
.score{
  position:relative;flex:1 1 210px;max-width:300px;padding:0;border:0;border-radius:16px 16px 12px 12px;
  background:var(--tc);color:var(--team-ink);
  display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"pts pts" "nm adj" "hl adj";gap:0;
  box-shadow:inset 0 -8px 0 rgba(0,0,0,.16),0 6px 0 rgba(0,0,0,.22);
}
.score .pts{
  grid-area:pts;display:block;text-align:center;margin:0;padding:8px 10px 4px;border-radius:16px 16px 0 0;
  background:var(--led);color:var(--led-ink);text-shadow:0 0 14px var(--led-glow);box-shadow:inset 0 0 0 3px var(--led-rim);
  font-family:var(--f-show);font-weight:700;font-size:clamp(1.9rem,3vw,2.7rem);line-height:1.15;
}
.score .pts.bump{animation:bump .6s ease}
@keyframes bump{30%{transform:scale(1.16)}}
.score .nm{grid-area:nm;color:var(--team-ink);font-family:var(--f-show);font-weight:700;font-size:1.15rem;line-height:1.3;padding:8px 16px 2px}
.score .nm .dot{display:none}
.score .tally{display:none}
.score .hl{grid-area:hl;padding:2px 16px 12px;margin:0}
.score .hl span{border:0;background:rgba(16,34,42,.16);color:var(--team-ink);font-weight:600;border-radius:8px;padding:3px 9px}
.score .adj{grid-area:adj;flex-direction:column;gap:5px;padding:8px 10px 12px;align-self:end}
.score .adj button{border:0;border-radius:8px;background:rgba(16,34,42,.16);color:var(--team-ink);font-weight:600}
.score .adj button:hover{background:rgba(16,34,42,.28);color:var(--team-ink)}
.score.is-turn{box-shadow:0 0 0 4px var(--bulb),0 0 32px var(--bulb-glow),0 6px 0 rgba(0,0,0,.22)}
.score.is-turn::before{content:"";position:absolute;left:6%;right:6%;bottom:calc(100% + 4px);height:40px;pointer-events:none;
  background:linear-gradient(to top,var(--spot),transparent);clip-path:polygon(32% 0,68% 0,100% 100%,0 100%)}

/* ---------- the question card ---------- */
#qover,#endover,#rover{background:
  radial-gradient(ellipse 80% 70% at 50% 45%,transparent 30%,var(--stage-dim) 100%),
  repeating-conic-gradient(from -3deg at 50% 45%,var(--stage) 0deg 6deg,var(--stage-ray) 6deg 12deg)}
.qcard{
  position:relative;width:min(1060px,calc(100% - 28px));background:var(--card);color:var(--card-ink);border-radius:30px;
  box-shadow:0 0 0 8px var(--tile),0 0 0 14px var(--sign),0 24px 60px rgba(0,0,0,.45);
  animation:qin .35s cubic-bezier(.2,1.3,.4,1);
}
@keyframes qin{from{opacity:0;transform:scale(.88)}}
.qc{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-show);font-weight:700;background:var(--sign);color:var(--sign-ink);padding:3px 18px 6px;border-radius:999px;font-size:clamp(1.05rem,1.8vw,1.4rem)}
.qc:empty{display:none}
.qc .ico{width:1.1em;height:1.1em}
.qv{font-family:var(--f-show);font-weight:700;color:var(--tile)}
.qcard .qv{color:var(--card-ink)}
.dd{font-family:var(--f-show);font-weight:700;background:var(--hot);color:var(--hot-ink)}
.qcard .qtext{color:var(--card-ink)}
.qhelp{color:var(--hot);font-weight:700}
.qcard .qhelp{color:var(--card-muted)}
.qcard .qtimer .trk{stroke:var(--card-line)}
.qcard .qtimer .prg{stroke:var(--sign)}
.qcard .qtimer.warn .prg{stroke:var(--bad)}
.qtimer .n{font-family:var(--f-show);font-weight:700}
.qcard .qtimer .n{color:var(--card-ink)}
.qcard .qtimer .n small{color:var(--card-muted);opacity:1}
.qtimer .prg{stroke:var(--tile)}
.qanswer{background:var(--hot);color:var(--hot-ink);border-radius:16px}
.qanswer .lbl{color:var(--hot-ink);opacity:.85}
.qanswer strong{font-family:var(--f-show);font-weight:700}
.qcard.revealed .qtimer{display:none}
.qcard.revealed .qtext{font-size:clamp(1.35rem,3vw,2.4rem)}
.qcard .qanswer{align-self:stretch;max-width:none;border-radius:0;margin-inline:calc(-1 * clamp(20px,4vw,52px));padding:14px 24px 18px}
.qcard .ghost{color:var(--card-ink);border-color:var(--card-line)}
.qcard .ghost:hover{border-color:var(--card-muted)}
.qcard .help{border-color:var(--card-ink);color:var(--card-ink);background:transparent}
.qcard .help:hover{background:rgba(16,34,42,.06)}
.qcard .help.tgt{background:var(--tc);color:var(--team-ink);border-color:transparent;box-shadow:0 4px 0 rgba(0,0,0,.22)}
.qsteal .lbl{color:var(--card-muted);font-weight:600}
.qcard .qjudge .lbl{color:var(--card-ink);opacity:1;font-family:var(--f-show);font-weight:700;font-size:clamp(1.25rem,2.4vw,1.7rem)}
#judge .jt{border:0;background:none;box-shadow:none;overflow:visible;display:flex;flex-wrap:wrap;justify-content:center;gap:18px}
#judge .jt-ok,#judge .jt-bad{
  min-width:min(250px,40vw);display:flex;flex-direction:column;align-items:center;gap:2px;border:0;border-radius:20px;padding:12px 26px 12px;
  font-family:var(--f-show);font-weight:700;font-size:clamp(1.6rem,3vw,2.3rem);line-height:1.15;cursor:pointer;
}
#judge .jt-ok small,#judge .jt-bad small{font-family:var(--f-body);font-size:1rem;font-weight:600;opacity:.92}
#judge .jt-ok{background:var(--good);color:var(--on-good);box-shadow:inset 0 3px 0 rgba(255,255,255,.3),0 8px 0 var(--good-deep)}
#judge .jt-bad{background:var(--bad);color:var(--on-bad);box-shadow:inset 0 3px 0 rgba(255,255,255,.25),0 8px 0 var(--bad-deep)}
#judge .jt-ok:hover,#judge .jt-bad:hover{filter:brightness(1.06)}
#judge .jt-ok:active,#judge .jt-bad:active{transform:translateY(5px)}
#judge .jt-ok,#judge .jt-bad{justify-content:center;min-height:84px}
.qcard .qjudge{gap:18px}
.jt{border:0;border-radius:14px;box-shadow:0 5px 0 rgba(0,0,0,.22)}
.qcard .fb,.qcard .fb-v{border-color:var(--card-line);color:var(--card-ink)}
.qcard .fb[aria-pressed="true"],.qcard .fb-v[aria-pressed="true"]{background:var(--tile);border-color:var(--tile);color:var(--tile-ink)}
.qcard .qflag{border-top:2px dashed var(--card-line)}
.qcard .qflag label,.qcard .linkish{color:var(--card-muted)}
.qcard .qflag textarea{background:var(--field);color:var(--card-ink);border-color:var(--card-line)}
.qcard .flag-done{background:rgba(16,34,42,.07);color:var(--card-ink)}
/* the steal: a stamp on the card */
.qstamp{
  position:absolute;top:-30px;inset-inline-end:clamp(18px,4vw,48px);margin:0;z-index:2;
  display:flex;flex-direction:column;align-items:center;padding:4px 22px 8px;border-radius:16px;transform:rotate(-8deg);
  background:var(--hot);color:var(--hot-ink);box-shadow:0 0 0 4px var(--card),0 0 0 7px var(--hot),0 12px 26px rgba(0,0,0,.35);
  animation:stamp .5s cubic-bezier(.2,1.6,.4,1);
}
.qstamp b{font-family:var(--f-show);font-weight:700;font-size:clamp(2rem,4vw,2.8rem);line-height:1.15}
.qstamp span{font-weight:700;font-size:1rem}
.qstamp span::before{content:"";display:inline-block;width:.7em;height:.7em;border-radius:50%;background:var(--tc);margin-inline-end:6px;box-shadow:0 0 0 2px var(--hot-ink)}
@keyframes stamp{from{opacity:0;transform:rotate(-8deg) scale(2.2)}}
@media (max-width:640px){.qstamp{position:static;transform:rotate(-3deg);margin-top:-6px}@keyframes stamp{from{opacity:0;transform:rotate(-3deg) scale(1.8)}}}

/* ---------- the end of a game ---------- */
.endcard{background:var(--card);color:var(--card-ink);border:0;border-radius:28px;width:min(640px,calc(100% - 28px));
  box-shadow:0 0 0 8px var(--tile),0 0 0 14px var(--sign),0 24px 60px rgba(0,0,0,.45);animation:qin .4s cubic-bezier(.2,1.3,.4,1)}
.end-k{color:var(--card-muted)}
.end-w{font-family:var(--f-show);font-weight:700;color:var(--card-ink)}
.end-w{line-height:1.35}
.end-w span{display:inline-block;background:var(--tc);color:var(--team-ink);padding:0 .3em .06em;margin-block:.08em;border-radius:.25em;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.endcard .rank li{background:var(--tc,rgba(16,34,42,.07));color:var(--team-ink);border-radius:14px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.endcard .rank li:first-child{box-shadow:0 0 0 4px var(--bulb),0 4px 0 rgba(0,0,0,.2);padding-block:14px}
.endcard .rank .pos,.endcard .rank .nm{color:var(--team-ink)}
.endcard .rank .p{min-width:3.6em;text-align:center;background:var(--led);color:var(--led-ink);text-shadow:0 0 10px var(--led-glow);font-family:var(--f-show);font-weight:700;padding:4px 14px 2px;border-radius:10px;box-shadow:inset 0 0 0 2px var(--led-rim)}
.endcard .ghost{color:var(--card-ink);border-color:var(--card-line)}

/* ---------- «أشهر إجابة» ---------- */
.fstage{background:var(--card);color:var(--card-ink);border-radius:30px;width:min(1060px,calc(100% - 28px));
  box-shadow:0 0 0 8px var(--tile),0 0 0 14px var(--sign),0 18px 50px rgba(0,0,0,.4)}
.fprompt{color:var(--card-ink)}
.fbank,.fctl .lbl,.fmsg{color:var(--card-ink)}
.fbank b{background:var(--led);color:var(--led-ink);text-shadow:0 0 10px var(--led-glow);padding:4px 14px 0;border-radius:10px;font-family:var(--f-show);font-weight:700}
.fctl .lbl b{background:var(--tc);color:var(--team-ink);padding:0 .35em;border-radius:6px}
.fx i{border-color:var(--card-line)}
.fx i.on{background:var(--bad);border-color:var(--bad);color:var(--on-bad)}
.ftile{background:var(--led);box-shadow:inset 0 0 0 3px var(--led-rim);border-radius:14px}
.ftile .rk{color:var(--led-ink);opacity:.9;font-family:var(--f-show);font-weight:700}
.ftile.open{background:linear-gradient(var(--tile-hi),var(--tile) 55%,var(--tile-lo));box-shadow:0 4px 0 var(--tile-edge)}
.ftile.open .tx{color:var(--tile-ink)}
.ftile .pt{background:var(--sign);color:var(--sign-ink);font-family:var(--f-show);font-weight:700}
.ftile.late{background:transparent;box-shadow:inset 0 0 0 2px var(--card-line)}
.ftile.late .tx,.ftile.late .pt{color:var(--card-muted);background:transparent}
.fform input{background:var(--field);color:var(--card-ink);border-color:var(--card-line)}
.fform input:focus{border-color:var(--sign)}
.fstage .ghost{color:var(--card-ink);border-color:var(--card-line)}
.fstage .judge-teams .lbl{color:var(--card-muted)}
.fstage .qflag label,.fstage .linkish{color:var(--card-muted)}
.fstage .qflag textarea{background:var(--field);color:var(--card-ink)}
.fbig{font-family:var(--f-show);font-weight:700;color:var(--bad);text-shadow:0 0 0 transparent,0 10px 0 var(--bad-deep),0 18px 50px rgba(0,0,0,.5)}

/* ---------- speed race ---------- */
.room-code{font-family:var(--f-show);font-weight:700;background:var(--led);color:var(--led-ink);text-shadow:0 0 18px var(--led-glow);padding:12px 26px 4px;border-radius:16px;box-shadow:inset 0 0 0 4px var(--led-rim)}
.qr{box-shadow:0 0 0 6px var(--tile),0 0 0 11px var(--sign)}
.players li{background:var(--wash);border:0;box-shadow:inset 0 0 0 2px var(--line)}
.ropt{border-radius:18px;font-weight:700;box-shadow:inset 0 3px 0 rgba(255,255,255,.22),0 6px 0 rgba(0,0,0,.3)}
.ropt.right{box-shadow:0 0 0 5px var(--bulb),0 0 26px var(--bulb-glow)}
.rcard .qtext{color:var(--cream)}

/* ---------- confetti and the big X ---------- */
.confetti{position:fixed;inset:0;z-index:70;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-24px;left:var(--x);width:var(--w);height:calc(var(--w) * 1.6);background:var(--c);border-radius:2px;
  animation:fall var(--t) cubic-bezier(.25,.6,.5,1) var(--d) forwards;opacity:0}
@keyframes fall{0%{opacity:1;transform:translate(0,0) rotate(0)}85%{opacity:1}100%{opacity:0;transform:translate(var(--dx),105vh) rotate(var(--r))}}

/* ---------- the lock ---------- */
.lockover{background:
  radial-gradient(ellipse 80% 70% at 50% 45%,transparent 30%,var(--stage-dim) 100%),
  repeating-conic-gradient(from -3deg at 50% 45%,var(--stage) 0deg 6deg,var(--stage-ray) 6deg 12deg)}
.lockcard{background:var(--card);color:var(--card-ink);border-radius:26px;padding:24px 26px 18px;width:min(400px,calc(100% - 28px));box-shadow:0 0 0 8px var(--tile),0 0 0 14px var(--sign),0 24px 60px rgba(0,0,0,.45)}
.lockcard .logo{color:var(--sign);text-shadow:none}
.lockform label{color:var(--card-muted)}
.lockform input{background:var(--field);color:var(--card-ink);border:2px solid var(--card-line);letter-spacing:.2em}
.lockmsg{color:var(--hot);font-weight:600}

/* ---------- phones ---------- */
.me b{color:var(--cream)}
.conn{background:var(--panel)}
#in-code{background:var(--led);color:var(--led-ink);border:0;box-shadow:inset 0 0 0 3px var(--led-rim);text-shadow:0 0 12px var(--led-glow);font-family:var(--f-show);font-weight:700}
.turnline{font-family:var(--f-show);font-weight:700;background:var(--wash);border:0;box-shadow:inset 0 0 0 2px var(--line);border-radius:999px}
.turnline.mine{background:var(--hot);color:var(--hot-ink);box-shadow:0 5px 0 var(--hot-deep)}
.turnline b{color:inherit!important;background:var(--tc,transparent)}
.pboard{gap:14px}
.prow{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.pc{grid-column:1/-1;justify-content:center;gap:8px;font-family:var(--f-show);font-weight:700;font-size:1rem;color:var(--sign-ink);background:var(--sign);border:3px dotted var(--bulb);border-radius:12px;padding:3px 10px 5px;box-shadow:0 0 0 2px var(--sign)}
.pc .ico{width:18px;height:18px}
.pv{border-radius:10px;font-family:var(--f-show);font-weight:700;border:0;background:rgba(0,0,0,.24);color:transparent}
button.pv,button.pv:not(:disabled){background:linear-gradient(var(--tile-hi),var(--tile) 55%,var(--tile-lo));color:var(--tile-ink);border:0;box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 4px 0 var(--tile-edge)}
button.pv:disabled{opacity:.62}
button.pv.sent{background:var(--hot);color:var(--hot-ink);box-shadow:0 4px 0 var(--hot-deep);opacity:1}
.pv.used{border:0;text-decoration:none;opacity:1;color:transparent;background:rgba(0,0,0,.24)}
.pv.used[style]{background:var(--tc)}
.pv.used[style]::after{display:none}
.pv.none{background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.buzzbtn{
  width:min(66vw,250px);border:0;color:var(--hot-ink);font-family:var(--f-show);font-weight:700;font-size:3.2rem;
  background:radial-gradient(circle at 40% 30%,#FF8A5C 0%,var(--sign) 40%,var(--sign-deep) 100%);
  box-shadow:0 0 0 12px var(--led),0 0 0 17px var(--tile),0 0 36px var(--bulb-glow),inset 0 -12px 0 rgba(0,0,0,.22),inset 0 6px 0 rgba(255,255,255,.3),0 26px 0 -6px rgba(0,0,0,.35);
  margin:30px 0 20px;
}
.buzzbtn:active{transform:translateY(5px);box-shadow:0 0 0 12px var(--led),0 0 0 17px var(--tile),inset 0 -6px 0 rgba(0,0,0,.22),inset 0 6px 0 rgba(255,255,255,.3)}
.buzzbtn:disabled{opacity:.7;transform:translateY(5px)}
#v-buzz .qmeta,#v-q .qmeta{align-items:center}
#v-buzz .qmeta b,#v-q .qmeta b{display:inline-flex;align-items:center;gap:6px;background:var(--sign);color:var(--sign-ink);font-family:var(--f-show);padding:2px 14px 4px;border-radius:999px}
#v-buzz .qmeta b .ico{width:18px;height:18px}
#v-buzz .qtext,#v-q .qtext{background:var(--card);color:var(--card-ink);border-radius:20px;padding:16px 18px;box-shadow:0 0 0 5px var(--tile)}
#g-scores li,#w-scores li,#f-rank li{background:var(--tc);color:var(--team-ink);border:0;border-radius:14px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
#g-scores li.mine,#w-scores li.mine,#f-rank li.mine{box-shadow:0 0 0 3px var(--bulb),0 4px 0 rgba(0,0,0,.2)}
#g-scores .dot,#w-scores .dot,#f-rank .dot{display:none}
#g-scores .nm,#w-scores .nm,#f-rank .nm,#f-rank .pos{color:var(--team-ink)}
#g-scores .p,#w-scores .p,#f-rank .p{background:var(--led);color:var(--led-ink);text-shadow:0 0 10px var(--led-glow);font-family:var(--f-show);font-weight:700;padding:2px 12px 0;border-radius:10px;min-width:3.2em;text-align:center}
.tp{font-family:var(--f-show);border-radius:16px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.16),0 5px 0 rgba(0,0,0,.25)}
.opt{border-radius:16px;font-weight:700;box-shadow:inset 0 3px 0 rgba(255,255,255,.2),0 5px 0 rgba(0,0,0,.3)}
.bar{background:var(--wash);height:10px}
.bar i{background:var(--tile)}

@media (max-width:560px){
  .modes{gap:6px}
  .mode{padding:7px 12px 8px;font-size:.95rem}
  .scores{gap:12px;padding-top:30px}
  .score{flex:1 1 100%;max-width:none;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"pts nm adj" "pts hl adj";border-radius:14px}
  .score .pts{border-radius:14px 0 0 14px;border-start-start-radius:14px;border-end-start-radius:14px;border-start-end-radius:0;border-end-end-radius:0;display:grid;place-items:center;min-width:4.2em;font-size:2rem}
  .score.is-turn::before{display:none}
}

/* brand theme */
/* قهوة الطيبين: the studio in its own colours (the studio's defaults are this brand's): a teal sunburst,
   orange signs, yellow tiles, magenta for whose turn it is. Shared by the screen and the phones. */
:root{
  --f-body:"Readex Pro",system-ui,Tahoma,sans-serif;
}
.tag{font-family:var(--f-body);font-size:.98rem;color:var(--muted)}

</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <p class="logo">قهوة الطيبين</p>
      <p class="tag" id="tag">العب من موبايلك</p>
    </div>
    <p class="me" id="me" hidden></p>
  </header>
  <p class="conn" id="conn" role="status" hidden></p>

  <main>
    <!-- join -->
    <section class="view" id="v-join">
      <form class="card" id="join-form" novalidate>
        <h1>ادخل اللعبة</h1>
        <label for="in-code">رقم الغرفة (يظهر على الشاشة)</label>
        <input id="in-code" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" enterkeyhint="next">
        <label for="in-name">اسمك</label>
        <input id="in-name" maxlength="16" autocomplete="nickname" enterkeyhint="go">
        <button class="primary" type="submit">ادخل</button>
        <p class="msg" id="join-msg" role="status"></p>
      </form>
    </section>

    <!-- connecting / lobby / between questions -->
    <section class="view" id="v-wait" hidden>
      <div class="card center">
        <p class="big-ico" id="w-ico" aria-hidden="true">✓</p>
        <h2 id="w-title"></h2>
        <p class="sub" id="w-sub"></p>
        <button class="help" id="w-two" type="button" hidden>جاوب جوابين</button>
        <ol class="rank" id="w-scores" hidden></ol>
        <button class="ghost" id="w-leave" type="button" hidden>اكتب رقم الغرفة تاني</button>
      </div>
    </section>

    <!-- board: pick a team -->
    <section class="view" id="v-team" hidden>
      <div class="card">
        <h2>اختار فريقك</h2>
        <div class="team-pick" id="t-pick"></div>
      </div>
    </section>

    <!-- board: the categories, the team whose turn it is picks -->
    <section class="view" id="v-board" hidden>
      <p class="sub center-t" id="g-last"></p>
      <p class="turnline" id="g-turn"></p>
      <div class="phelps" id="g-helps" role="group" aria-label="وسائل المساعدة" hidden></div>
      <div class="pboard" id="g-board"></div>
      <p class="sub center-t" id="g-note"></p>
      <ol class="rank" id="g-scores"></ol>
    </section>

    <!-- board: buzzer -->
    <section class="view" id="v-buzz" hidden>
      <div class="qmeta"><span id="b-val"></span><b id="b-cat"></b></div>
      <p class="qtext" id="b-text"></p>
      <button class="help" id="b-two" type="button" hidden>جاوب جوابين</button>
      <button class="buzzbtn" id="b-btn" type="button" hidden>اسرق!</button>
      <p class="sub center-t" id="b-note"></p>
    </section>

    <!-- question -->
    <section class="view" id="v-q" hidden>
      <div class="qmeta"><span id="q-n"></span><b id="q-cat"></b></div>
      <p class="qtext" id="q-text"></p>
      <div class="bar" id="q-bar"><i id="q-fill"></i></div>
      <p class="left" id="q-left"></p>
      <div class="opts" id="q-opts"></div>
    </section>

    <!-- answer sent -->
    <section class="view" id="v-sent" hidden>
      <div class="card center">
        <p class="big-ico" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6h24M12 42h24M15 6c0 10 18 12 18 18s-18 8-18 18M33 6c0 10-18 12-18 18s18 8 18 18"/></svg></p>
        <h2>وصلت إجابتك</h2>
        <span class="chip" id="s-chip"></span>
        <p class="sub" id="s-sub">انتظر حتى يجيب الباقون أو ينتهي الوقت.</p>
      </div>
    </section>

    <!-- result of one question -->
    <section class="view" id="v-res" hidden>
      <div class="card center" id="r-card">
        <p class="big-ico" id="r-ico" aria-hidden="true"></p>
        <p class="lead" id="r-lead"></p>
        <p class="pts" id="r-pts"></p>
        <div class="answer"><p class="sub">الإجابة الصحيحة</p><strong id="r-ans"></strong></div>
        <p class="sub" id="r-rank"></p>
      </div>
    </section>

    <!-- final -->
    <section class="view" id="v-final" hidden>
      <div class="card center">
        <p class="sub" id="f-sub">انتهى السباق</p>

<script>
/* Live room over Supabase Realtime "broadcast" (Phoenix websocket protocol, vsn 1.0.0).
   Shared by the host screen and the phone page. Nothing is stored: messages only pass between the open pages.
   Reconnects on its own (phones sleep, networks drop) and re-sends what was queued while it was down. */
function liveRoom(opts){
  // opts: {topic, onMessage(event, payload), onStatus(status)}; status is "connecting" | "open" | "down" | "refused"
  const KEY = "sb_publishable_6LjuIzeMjepexKqCHCy9vQ_IcLWX4DX";
  const QUERY = "apikey=" + encodeURIComponent(KEY) + "&vsn=1.0.0";
  let url = "wss://bsfzfarfrnxgpckmprut.supabase.co/realtime/v1/websocket?" + QUERY;
  try { // test hook: a local relay, never another host
    const o = new URLSearchParams(location.search).get("rt");
    if (o && /^ws:\/\/(127\.0\.0\.1|localhost)(:\d+)?\/[^?#]*$/.test(o)) url = o + "?" + QUERY;
  } catch(e){}
  const topic = "realtime:" + opts.topic;
  let ws = null, ref = 0, joinRef = null, hb = 0, retry = 0, timer = 0, closed = false, joined = false, st = "";
  const waiting = [];
  const nextRef = () => String(++ref);
  function status(s){ if (s !== st){ st = s; try { opts.onStatus && opts.onStatus(s); } catch(e){} } }
  function raw(m){ if (ws && ws.readyState === 1){ ws.send(JSON.stringify(m)); return true; } return false; }
  function connect(){
    clearTimeout(timer);
    if (closed) return;
    status("connecting");
    let sock;
    try { sock = new WebSocket(url); } catch(e){ later(); return; }
    ws = sock;
    sock.onopen = () => {
      if (ws !== sock) return;
      joinRef = nextRef();
      raw({topic, event:"phx_join", payload:{config:{broadcast:{self:false, ack:false}, presence:{key:""}, private:false}}, ref:joinRef, join_ref:joinRef});
      clearInterval(hb);
      hb = setInterval(() => raw({topic:"phoenix", event:"heartbeat", payload:{}, ref:nextRef()}), 25000);
    };
    sock.onmessage = ev => {
      if (ws !== sock) return;
      let m; try { m = JSON.parse(ev.data); } catch(e){ return; }
      if (!m || m.topic !== topic) return;
      if (m.event === "phx_reply" && m.ref === joinRef){
        if (m.payload && m.payload.status === "ok"){ joined = true; retry = 0; status("open"); flush(); }
        else { status("refused"); try { sock.close(); } catch(e){} }
        return;
      }
      if (m.event === "broadcast" && m.payload && typeof m.payload.event === "string"){
        try { opts.onMessage(m.payload.event, m.payload.payload || {}); } catch(e){}
        return;
      }
      if (m.event === "phx_error" || m.event === "phx_close"){ try { sock.close(); } catch(e){} }
    };
    sock.onclose = () => {
      if (ws !== sock) return;
      joined = false; clearInterval(hb);
      if (!closed){ if (st !== "refused") status("down"); later(); }
    };
    sock.onerror = () => {};
  }
  function later(){
    if (closed) return;
    clearTimeout(timer);
    const wait = Math.min(8000, 400 * Math.pow(2, retry++)) + Math.random() * 300;
    timer = setTimeout(connect, wait);
  }
  function flush(){
    while (joined && waiting.length){
      const [event, payload] = waiting.shift();
      raw({topic, event:"broadcast", payload:{type:"broadcast", event, payload}, ref:nextRef(), join_ref:joinRef});
    }
  }
  function send(event, payload){
    if (joined && raw({topic, event:"broadcast", payload:{type:"broadcast", event, payload}, ref:nextRef(), join_ref:joinRef})) return;
    waiting.push([event, payload]);
    if (waiting.length > 40) waiting.shift();
  }
  function wake(){
    // called when the page comes back to the foreground: reconnect now instead of waiting for the backoff
    if (closed) return;
    if (!ws || ws.readyState > 1){ retry = 0; connect(); }
  }
  function close(){
    closed = true; clearTimeout(timer); clearInterval(hb); joined = false;
    try { if (ws) ws.close(); } catch(e){}
    ws = null;
  }
  connect();
  return {send, wake, close, isOpen: () => joined};
}

}
function answer(q, k){
  if (myAnswer(q.i) != null) return;
  const key = qkey(q.i);
  const left = deadline[key] - performance.now();
  if (left <= 0) return;
  const ms = Math.max(0, Math.round(performance.now() - shownAt[key]));
  saved.ans = saved.ans || {}; saved.ans[key] = k;
  const keys = Object.keys(saved.ans); if (keys.length > 60) delete saved.ans[keys[0]];
  persist();
  room.send("answer", {pid:me.pid, i:q.i, c:k, ms});
  try { if (navigator.vibrate) navigator.vibrate(25); } catch(e){}
  sentView(q, k);
}
/* buzzer race: one big button; the first press (by the synced clocks) answers out loud, the screen judges */
function raceBuzzView(q){
  const k = qkey(q.i);
  deadline[k] = performance.now() + Math.max(0, Number(q.remain) || 0);   // the clock stops while someone answers
  if (q.buzz){
    if (q.buzz.pid === me.pid) waitView("bell", "إنت أول واحد ضغط!", "جاوب بصوت عالي، والحكم على الشاشة.");
    else waitView("bell", q.buzz.name + " ضغط الأول", "لو إجابته غلط، الزرار هيفتح تاني.");
    return;
  }
  if (Array.isArray(q.out) && q.out.includes(me.pid)){ waitView("out", "خرجت من السؤال ده", "استنى السؤال الجاي."); return; }
  view("v-q");
  $("q-n").textContent = "سؤال " + fmt(q.i + 1) + " من " + fmt(q.n) + "، " + fmt(q.val || 0) + " نقطة";
  $("q-cat").textContent = q.cat || "";
  $("q-text").textContent = q.text || "";
  const box = $("q-opts");
  if (box.dataset.k !== q.key){
    box.dataset.k = q.key;
    const b = h("button",{class:"buzzbtn",id:"rb-btn",type:"button",style:"--tc:var(--brass)"}, "اضغط!");
    b.addEventListener("pointerdown", raceBuzz); b.addEventListener("click", raceBuzz);
    box.replaceChildren(b);
  }
  const btn = $("rb-btn"), sent = rbSent === q.key;
  btn.disabled = sent; btn.textContent = sent ? "ضغطت!" : "اضغط!";
  onTick();
}
function raceBuzz(e){
  if (e && e.type === "pointerdown") e.preventDefault();
  const at = performance.now(), p = last, q = p && p.q;
  if (!q || p.phase !== "question" || q.style !== "buzz" || q.buzz || rbSent === q.key || !room) return;
  if ((deadline[qkey(q.i)] || 0) - at <= 0) return;
  rbSent = q.key;
  room.send("buzz", {pid:me.pid, key:q.key, at:clk ? Math.round(at + clk.off) : null});
  try { if (navigator.vibrate) navigator.vibrate(40); } catch(err){}
  raceBuzzView(q);
}
function sentView(q, k){
  view("v-sent");
  const chip = $("s-chip");
  if (k != null && q.opts && q.opts[k] != null){
    chip.hidden = false; chip.style.setProperty("--oc", "var(--o" + k + ")");
    chip.replaceChildren(h("span",{"aria-hidden":"true"}, SHAPES[k]), h("span", null, q.opts[k]));
  } else chip.hidden = true;
}
function onTick(){
  const p = last; if (!p || p.phase !== "question" || !p.q || $("v-q").hidden) return;
  const q = p.q, limit = Math.max(1, Number(q.limit) || 1);
  const left = Math.max(0, (deadline[qkey(q.i)] || 0) - performance.now());
  $("q-fill").style.transform = "scaleX(" + (left / limit).toFixed(3) + ")";
  $("q-bar").classList.toggle("warn", left <= 5000);
  const s = Math.ceil(left / 1000);
  $("q-left").textContent = left > 0 ? "باقي " + fmt(s) + " ث" : "انتهى الوقت";
  if (left <= 0) document.querySelectorAll("#q-opts .opt, #q-opts .buzzbtn").forEach(b => { b.disabled = true; });
}
function resultView(q){
  view("v-res");
  const r = (q.results || {})[me.pid];
  const card = $("r-card");
  card.classList.toggle("res-ok", !!(r && r.ok));
  card.classList.toggle("res-bad", !!(r && !r.ok));
  if (r && r.ok){ $("r-ico").textContent = "✓"; $("r-lead").textContent = "إجابة صحيحة!"; $("r-pts").textContent = fmtS(r.pts || 0); }
  else if (r){ $("r-ico").textContent = "✗"; $("r-lead").textContent = "إجابة خاطئة"; $("r-pts").textContent = r.pts ? fmtS(r.pts) : ""; }
  else { $("r-ico").textContent = "–"; $("r-lead").textContent = "لم تُجب عن هذا السؤال"; $("r-pts").textContent = ""; }
  $("r-ans").textContent = q.style === "buzz" ? (q.answer || "") : (q.opts && q.correct != null) ? q.opts[q.correct] : "";
  const mr = myRank();
  $("r-rank").textContent = mr ? "ترتيبك " + fmt(mr.pos) + " من " + fmt(mr.of) + "، مجموعك " + fmt(mr.score) + " نقطة" : "";
}
function finalView(){
  view("v-final"); $("f-sub").textContent = "انتهى السباق";
  const mr = myRank(), ps = players();
  $("f-title").textContent = mr ? (mr.pos === 1 ? "أنت الفائز!" : "المركز " + fmt(mr.pos) + " من " + fmt(mr.of)) : "النتيجة النهائية";
  $("f-pts").textContent = mr ? fmt(mr.score) + " نقطة" : "";
  $("f-rank").replaceChildren(...ps.slice(0, 5).map((x,k) => h("li",{class:x.id === me.pid ? "mine" : null},
    h("span",{class:"pos"}, fmt(k + 1)), h("span",{class:"nm"}, x.name), h("span",{class:"p"}, fmt(x.score || 0)))));
}

/* ===== board: teams and buzzer ===== */
function bTeams(){ return Array.isArray(last && last.teams) ? last.teams : []; }
function myTeam(){
  const ok = id => !!id && bTeams().some(t => t.id === id);
  const mine = players().find(x => x.id === me.pid);
  if (mine && ok(mine.team)){
    if (saved.team !== mine.team || saved.teamCode !== me.code){ saved.team = mine.team; saved.teamCode = me.code; persist(); }
    return mine.team;
  }
  return (saved.teamCode === me.code && ok(saved.team)) ? saved.team : null;
}
function teamName(id){ const t = bTeams().find(x => x.id === id); return t ? t.name : ""; }
function teamColor(id){ const t = bTeams().find(x => x.id === id); return t ? t.color : null; }
function scoresList(tid, at){
  const teams = bTeams().slice().sort((a,b) => (b.score || 0) - (a.score || 0));
  const el = $(at || "w-scores"); el.hidden = !teams.length;
  el.replaceChildren(...teams.map(t => h("li",{class:t.id === tid ? "mine" : null,style:"--tc:" + t.color},
    h("span",{class:"dot","aria-hidden":"true"}), h("span",{class:"nm"}, t.name), tallyOf(t.won || 0), h("span",{class:"p"}, fmt(t.score || 0)))));
}
function tallyOf(n){ const el = h("span",{class:"tally",role:"img","aria-label":fmt(n) + " صح"}); el.innerHTML = tallySvg(n); return el; }
function boardRender(p){
  $("tag").textContent = "لوحة الفئات";
  const tid = myTeam();
  if (!tid){ teamView(); return; }
  $("me").hidden = false;
  $("me").replaceChildren(h("b", null, me.name), "، ", h("b",{style:"color:" + (teamColor(tid) || "inherit")}, teamName(tid)));
  const q = p.q || null;
  if (q && p.phase === "reveal"){ waitView("ok", "الإجابة: " + (q.answer || ""), "استنوا الحكم على الشاشة."); scoresList(tid); return; }
  if (q && p.phase === "open"){ boardQView(q, tid); return; }
  if (p.phase === "final"){ boardFinal(tid); return; }
  if (p.phase === "idle" && p.board){ boardView(p, tid); return; }
  waitView("ok", "إنت في " + teamName(tid), "استنوا لحد ما اللعب يبدأ على الشاشة.");
  scoresList(tid);
}
function boardView(p, tid){
  view("v-board");
  const B = p.board, myTurn = p.turn === tid, l = p.last;
  if (pickSent && (pickSent.gid !== B.gid || Date.now() - pickSent.at > 4000)) pickSent = null;
  $("g-last").textContent = !l ? "" : l.team ? teamName(l.team) + " كسب " + fmt(l.pts || 0) + " نقطة."
    : l.wrong ? teamName(l.wrong) + " جاوب غلط" + (l.pts ? " واتخصم منه " + fmt(l.pts) + " نقطة." : ".") : "السؤال اللي فات محدش جاوبه.";
  const tl = $("g-turn");
  tl.classList.toggle("mine", myTurn);
  const a = p.helps && p.armed && p.armed.team === p.turn ? p.armed : null;
  const tb = id => h("b",{style:"color:" + (teamColor(id) || "inherit")}, teamName(id));
  tl.replaceChildren(...(myTurn
    ? (a ? ["لعبتوا دبل! اختاروا سؤال"] : ["الدور عليكم! اختاروا سؤال"])
    : (a ? ["الدور على ", tb(p.turn), "، ولعب دبل"] : ["الدور على ", tb(p.turn), " يختار"])));
  helpsRow(p, tid, myTurn, a);
  $("g-board").replaceChildren(...B.cats.map((name, ci) => h("div",{class:"prow"},
    h("span",{class:"pc"}, Array.isArray(B.slugs) ? iconEl(B.slugs[ci]) : null, name),
    ...B.vals.map((v, ri) => {
      const st = (B.cells[ci] || [])[ri], key = ci + "-" + ri;
      if (st === "x") return h("span",{class:"pv none","aria-hidden":"true"});
      if (st) return h("span",{class:"pv used",style:st !== "-" && teamColor(st) ? "--tc:" + teamColor(st) : null,"aria-label":name + "، " + fmt(v) + "، اتلعب"}, fmt(v));
      const sent = pickSent && pickSent.cell === key;
      return h("button",{class:"pv" + (sent ? " sent" : ""),type:"button",disabled:(!myTurn || pickSent) ? true : null,"aria-label":name + "، " + fmt(v) + " نقطة",onclick:() => pick(key, B.gid)}, fmt(v));
    }))));
  $("g-note").textContent = myTurn ? (pickSent ? "جارٍ فتح السؤال على الشاشة…" : "السؤال اللي تختاروه هيظهر على الشاشة.") : "استنوا لحد ما يختاروا سؤال.";
  scoresList(tid, "g-scores");
}
/* helps: the team whose turn it is can call دبل before picking; the team answering can call جاوب جوابين;
   any other team can steal the question while it is on screen and the answer is not shown yet */
function myHelps(tid){ const t = bTeams().find(x => x.id === tid); return t && Array.isArray(t.helps) ? t.helps : []; }
function sendHelp(kind, extra){
  if (!room) return;
  helpSent = Object.assign({kind, at:Date.now()}, extra || {});
  room.send("help", Object.assign({pid:me.pid, kind}, extra || {}));
  try { if (navigator.vibrate) navigator.vibrate(kind === "steal" ? 40 : 20); } catch(e){}
  render();
  clearTimeout(helpT); helpT = setTimeout(() => { helpSent = null; render(); }, 2500);
}
function helpsRow(p, tid, myTurn, a){
  const box = $("g-helps");
  if (!p.helps || !myTurn || !myHelps(tid).includes("dbl")){ box.hidden = true; box.replaceChildren(); return; }
  const on = !!a;
  box.hidden = false;
  box.replaceChildren(h("button",{class:"help" + (on ? " on" : ""),type:"button","aria-pressed":String(on),disabled:pickSent ? true : null,onclick:() => sendHelp(on ? "none" : "dbl")}, "دبل"));
}
const sentFor = (kind, q) => !!helpSent && helpSent.kind === kind && helpSent.key === q.key;
function twoBtn(el, q, tid){
  const can = !!(last && last.helps && q && !q.two && q.answerer === tid && myHelps(tid).includes("two"));
  el.hidden = !can; if (!can) return;
  const sent = sentFor("two", q);
  el.disabled = sent; el.textContent = sent ? "اتبعت…" : "جاوب جوابين";
  el.onclick = () => sendHelp("two", {key:q.key});
}
function pick(cell, gid){
  if (!room || pickSent) return;
  pickSent = {cell, gid, at:Date.now()};
  room.send("pick", {pid:me.pid, cell, gid});
  try { if (navigator.vibrate) navigator.vibrate(25); } catch(e){}
  render();
  clearTimeout(pickT); pickT = setTimeout(render, 4100);
}
function teamView(){
  view("v-team");
  $("t-pick").replaceChildren(...bTeams().map(t => h("button",{class:"tp",type:"button",style:"--tc:" + t.color,onclick:() => pickTeam(t.id)}, t.name)));
}
function pickTeam(id){ saved.team = id; saved.teamCode = me.code; persist(); hello(); render(); }
function boardQView(q, tid){
  view("v-buzz");
  pickSent = null;
  const mine = q.answerer === tid, tn = id => teamName(id);
  $("b-cat").replaceChildren(...(q.slug ? [iconEl(q.slug)] : []), q.cat || "");
  $("b-val").textContent = fmt((q.val || 0) * (q.dbl && q.dbl === q.answerer ? 2 : 1)) + " نقطة";
  $("b-text").textContent = q.text || "";
  twoBtn($("b-two"), q, tid);
  const canSteal = !!(last && last.helps && !q.steal && q.owner !== tid && myHelps(tid).includes("steal"));
  const btn = $("b-btn"), sent = sentFor("steal", q);
  btn.hidden = !canSteal;
  if (canSteal){ btn.style.setProperty("--tc", teamColor(tid) || "var(--brass)"); btn.disabled = sent; btn.textContent = sent ? "اتبعت…" : "اسرق!"; }
  let note;
  if (q.steal) note = mine ? "سرقتوا السؤال! جاوبوا بصوت عالي." : q.owner === tid ? tn(q.steal) + " سرق السؤال منكم." : tn(q.steal) + " سرق السؤال من " + tn(q.owner) + ".";
  else note = mine ? "السؤال ليكم. جاوبوا بصوت عالي، والحكم على الشاشة." : "السؤال بتاع " + tn(q.answerer) + "." + (canSteal ? " لو عايزين تسرقوه، اضغطوا قبل ما يجاوبوا." : "");
  if (q.dbl) note += q.dbl === tid ? " لعبتوا دبل: النقط ضعف." : " " + tn(q.dbl) + " لعب دبل.";
  if (q.dblBack === tid) note += " الدبل رجعلكم.";
  if (q.two) note += q.two === tid ? " بتجاوبوا جوابين." : " " + tn(q.two) + " بيجاوب جوابين.";
  $("b-note").textContent = note;
}
function doSteal(e){
  if (e && e.type === "pointerdown") e.preventDefault();
  const p = last; if (!p || p.kind !== "board" || p.phase !== "open" || !p.q || p.q.steal || !room) return;
  if (sentFor("steal", p.q)) return;
  sendHelp("steal", {key:p.q.key});
}
function boardFinal(tid){
  view("v-final"); $("f-sub").textContent = "انتهت اللوحة";
  const ranked = bTeams().slice().sort((a,b) => (b.score || 0) - (a.score || 0));
  const top = ranked.length ? ranked[0].score || 0 : 0, winners = ranked.filter(t => (t.score || 0) === top);
  $("f-title").textContent = winners.length !== 1 ? "تعادل" : winners[0].id === tid ? "فريقك كسب!" : "مبروك يا " + winners[0].name;
  $("f-pts").textContent = "";
  $("f-rank").replaceChildren(...ranked.map((t,k) => h("li",{class:t.id === tid ? "mine" : null,style:"--tc:" + t.color},
    h("span",{class:"pos"}, fmt(k + 1)), h("span",{class:"dot","aria-hidden":"true"}), h("span",{class:"nm"}, t.name), h("span",{class:"p"}, fmt(t.score || 0)))));
}

/* ===== screen + lifecycle ===== */
let wl = null;
async function keepAwake(){ try { if ("wakeLock" in navigator && !wl){ wl = await navigator.wakeLock.request("screen"); wl.addEventListener("release", () => { wl = null; }); } } catch(e){ wl = null; } }
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible" || !room) return;
  room.wake(); hello(); keepAwake();
});

$("join-form").addEventListener("submit", submitJoin);
$("in-code").addEventListener("input", e => { const v = cleanCode(e.target.value); if (v !== e.target.value) e.target.value = v; if (v.length === 4 && !$("in-name").value) $("in-name").focus(); });
$("w-leave").addEventListener("click", () => showJoin());
$("b-btn").addEventListener("pointerdown", doSteal);
$("b-btn").addEventListener("click", doSteal);
$("c-again").addEventListener("click", () => { saved.code = ""; persist(); try { history.replaceState(null, "", location.pathname); } catch(e){} showJoin(); });
window.addEventListener("hashchange", () => { const c = codeFromUrl(); if (c && c !== me.code) showJoin(); });

// Back on the same room after a reload or a lock screen: rejoin straight away.
const startCode = codeFromUrl();
if (startCode && saved.code === startCode && saved.pid && cleanName(saved.name)) join(startCode, cleanName(saved.name));
else showJoin();
})();
</script>
