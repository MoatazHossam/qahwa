<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>لوحة الإدارة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#f5f6f7; --panel:#ffffff; --sunk:#eef0f2; --ink:#16181b; --ink-2:#454b52; --muted:#6b7178; --line:#e2e5e8;
  --accent:#2a78d6; --accent-ink:#ffffff; --accent-soft:#e6f0fb;
  --warn-bg:#fff2cc; --warn-ink:#6e4b00; --bad:#c62f2f; --bad-soft:#fde8e8; --ok:#1d7a46; --ok-soft:#e3f4ea;
  --radius:10px; --shadow:0 1px 2px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --bg:#121416; --panel:#1b1e21; --sunk:#16191c; --ink:#eceef0; --ink-2:#c3c8cd; --muted:#9aa1a8; --line:#2c3136;
    --accent:#3987e5; --accent-ink:#ffffff; --accent-soft:#1d2b3d;
    --warn-bg:#3a2e10; --warn-ink:#f0c96a; --bad:#ef6b6b; --bad-soft:#3a1d1f; --ok:#5cc58a; --ok-soft:#173022;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#121416; --panel:#1b1e21; --sunk:#16191c; --ink:#eceef0; --ink-2:#c3c8cd; --muted:#9aa1a8; --line:#2c3136;
  --accent:#3987e5; --accent-ink:#ffffff; --accent-soft:#1d2b3d;
  --warn-bg:#3a2e10; --warn-ink:#f0c96a; --bad:#ef6b6b; --bad-soft:#3a1d1f; --ok:#5cc58a; --ok-soft:#173022;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.6 "Readex Pro",system-ui,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none !important}
h1,h2,h3{margin:0;font-weight:600;line-height:1.3}
h1{font-size:1.25rem} h2{font-size:1.05rem} h3{font-size:.95rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.num{font-variant-numeric:tabular-nums}

/* buttons and fields */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.danger.sure{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn[disabled]{opacity:.55;cursor:default}
.field{display:grid;gap:4px}
.field>span{font-size:.85rem;color:var(--ink-2);font-weight:500}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=search],select,textarea{
  width:100%;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:8px 10px;min-width:0}
textarea{resize:vertical;min-height:72px}
.msg{font-size:.9rem;padding:8px 12px;border-radius:8px}
.msg.err{background:var(--bad-soft);color:var(--bad)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}

/* sign in */
.signin{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.signin .card{width:min(400px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;display:grid;gap:16px;box-shadow:var(--shadow)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:3px;background:var(--sunk);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:7px;padding:5px 12px;cursor:pointer;color:var(--ink-2);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}

/* app frame */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top .in{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.top .who{margin-inline-start:auto;display:flex;align-items:center;gap:10px}
.tabs{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 12px;cursor:pointer;color:var(--ink-2);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.count{display:inline-block;min-width:22px;padding:0 6px;border-radius:999px;background:var(--sunk);color:var(--ink-2);font-size:.78rem;text-align:center;line-height:20px}
.count.alert{background:var(--bad);color:#fff}
main{max-width:1180px;margin:0 auto;padding:20px 16px 60px;display:grid;gap:20px}
main>*,.panel,.stack>*{min-width:0}
.stack{display:grid;gap:20px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.panel>.hd{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline}
.panel>.bd{padding:16px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border-radius:var(--radius);padding:12px 14px;font-size:.92rem}

/* reports */
.report{padding:16px;display:grid;gap:12px}
.report+.report{border-top:1px solid var(--line)}
.report .where{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:.85rem;color:var(--muted)}
.report .q{font-size:1.05rem;font-weight:500}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:.92rem;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.notes{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.notes li{background:var(--sunk);border-radius:8px;padding:8px 12px;font-size:.9rem}
.notes li .when{color:var(--muted);font-size:.8rem;margin-inline-start:8px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.answers{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:.92rem}
.answers li{display:flex;gap:10px} .answers .pts{color:var(--muted);min-width:2.5em}
.tag{display:inline-block;padding:1px 8px;border-radius:6px;background:var(--sunk);color:var(--ink-2);font-size:.78rem;font-weight:500}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.warn{background:var(--warn-bg);color:var(--warn-ink)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
details>summary{cursor:pointer;color:var(--ink-2);font-weight:500;padding:12px 16px}
.closed{list-style:none;margin:0;padding:0 16px 14px;display:grid;gap:6px;font-size:.9rem}

/* filters + tables */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.filters .field{min-width:150px;flex:1 1 150px}
.filters .field.grow{flex:3 1 220px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:.8rem;white-space:nowrap;background:var(--panel);position:sticky;top:0}
td.n,th.n{text-align:end;white-space:nowrap}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--sunk)}
td .sub{display:block;color:var(--muted);font-size:.82rem;margin-top:2px}
.qcell{min-width:260px;max-width:520px}
.more{display:flex;justify-content:center;padding:12px}

/* capacity grid */
table.cap{width:auto;min-width:min(100%,640px)}
.cap td:first-child{min-width:150px}
.cap td.c,.cap th.n{text-align:center;font-variant-numeric:tabular-nums;width:78px}
.cap td.low{background:var(--warn-bg);color:var(--warn-ink);font-weight:600}
.cap td.minc{font-weight:600}

/* tiles + chart */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:grid;gap:2px}
.tile .v{font-size:1.7rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .k{color:var(--ink-2);font-size:.88rem}
.tile .s{color:var(--muted);font-size:.8rem}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .bar{fill:#2a78d6}
:root[data-theme="dark"] .chart .bar{fill:#3987e5}
@media (prefers-color-scheme: dark){ :root:where(:not([data-theme="light"])) .chart .bar{fill:#3987e5} }
.chart .hit{fill:transparent;cursor:default}
.chart .hit:hover,.chart .hit:focus{fill:color-mix(in srgb,var(--ink) 6%,transparent);outline:none}
.chart{min-height:200px}
.chart text{fill:var(--muted);font-size:11px;font-family:inherit}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.82rem;padding:6px 10px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-100%);z-index:2}

/* dialog */
dialog{border:0;border-radius:14px;padding:0;width:min(720px,calc(100% - 24px));max-height:calc(100vh - 32px);background:var(--panel);color:var(--ink)}
dialog::backdrop{background:rgba(10,12,14,.45)}
dialog form{display:grid;gap:14px;padding:20px}
dialog .hd{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.arow{display:grid;grid-template-columns:2fr 80px 3fr auto;gap:8px;align-items:center}
.srcs{margin:0;padding:0 18px 0 0;font-size:.85rem;display:grid;gap:2px}
.srcs a{color:var(--accent);word-break:break-all}
.foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center}
.foot .msg{margin-inline-end:auto}

@media (max-width:640px){
  .row2,.row3{grid-template-columns:1fr}
  .arow{grid-template-columns:1fr 70px auto;}
  .arow .alt{grid-column:1 / -1}
  .kv{grid-template-columns:1fr}
  .kv dt{margin-top:4px}
  .top .who{margin-inline-start:0;width:100%;justify-content:space-between}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
.review .checks{display:grid;gap:4px;margin:0;font-size:.88rem}
.sbg summary{cursor:pointer;font-size:.9rem;color:var(--ink-2)}
.sbg .kv{margin-top:6px}
#sb-panel>summary{cursor:pointer;list-style:none}
#sb-panel>summary::-webkit-details-marker{display:none}
.review .checks p{margin:0}
.bulk{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.bulk h3{margin:0;font-size:1rem}
table.words td .actions{flex-wrap:nowrap}
.brandform{display:grid;gap:12px;max-width:560px}
#p-brand .panel+.panel{margin-top:16px}
.colors{display:flex;flex-wrap:wrap;gap:8px}
.colors input{width:52px;height:40px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
/* pictures (image questions) */
.thumb{width:56px;height:38px;object-fit:cover;border-radius:6px;background:var(--sunk);border:1px solid var(--line);vertical-align:middle;margin-inline-end:8px;float:inline-start}
.pics{display:flex;flex-wrap:wrap;gap:12px;margin:0}
.pics figure{margin:0;display:grid;gap:4px;max-width:min(320px,100%)}
.pics img{display:block;max-width:100%;max-height:200px;border-radius:8px;border:1px solid var(--line);background:var(--sunk)}
.pics figcaption{font-size:.8rem;color:var(--muted)}
.pic{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:8px}
.picrow{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.picprev{width:150px;height:100px;border-radius:8px;background:var(--sunk);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:.8rem;text-align:center;padding:4px}
.picprev img{max-width:100%;max-height:100%;display:block}
.picbtns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.picbtns input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.picurl{font-size:.85rem}
.cropper{position:relative;display:inline-block;max-width:100%;overflow:hidden;border-radius:6px;touch-action:none;cursor:crosshair;user-select:none;line-height:0;justify-self:start}
.pic>.btn{justify-self:start}
.cropper img{display:block;max-width:100%;max-height:320px;border-radius:6px;pointer-events:none}
.cropper .sel{position:absolute;border:2px solid var(--accent);box-shadow:0 0 0 9999px rgba(0,0,0,.45);border-radius:2px;pointer-events:none}
.cropper .sel[hidden]{display:none}
.newq{margin-inline-start:auto;align-self:end}
.check{display:flex;gap:8px;align-items:center;font-size:.92rem}
.check[hidden]{display:none}
</style>
</head>
<body>

<section class="signin" id="v-signin" hidden>
  <form class="card" id="f-signin" novalidate>
    <div>
      <h1>لوحة الإدارة</h1>
      <p class="muted small">قهوة الطيبين وزملكاوي</p>
    </div>
    <div class="seg" role="group" aria-label="نوع الدخول">
      <button type="button" id="m-in" aria-pressed="true">دخول</button>
      <button type="button" id="m-up" aria-pressed="false">حساب جديد</button>
    </div>
    <label class="field"><span>الإيميل</span><input type="email" id="in-email" autocomplete="username" required dir="ltr"></label>
    <label class="field"><span>كلمة السر</span><input type="password" id="in-pass" autocomplete="current-password" required dir="ltr" minlength="6"></label>
    <p class="msg" id="in-msg" hidden></p>
    <button class="btn primary" type="submit" id="in-go">ادخل</button>
  </form>
</section>

<section id="v-denied" class="signin" hidden>
  <div class="card">
    <h1>الحساب ده مش من حسابات الإدارة</h1>
    <p class="muted" id="denied-who"></p>
    <button class="btn" type="button" id="denied-out">اخرج وادخل بحساب تاني</button>
  </div>
</section>

<div id="v-app" hidden>
  <header class="top">
    <div class="in">
      <h1>لوحة الإدارة</h1>
      <div class="seg" role="group" aria-label="الهوية" id="brand-seg"></div>
      <div class="who">
        <span class="muted small" id="who"></span>
        <button class="btn" type="button" id="b-reload">تحديث</button>
        <button class="btn" type="button" id="b-out">خروج</button>
      </div>
    </div>
    <nav class="tabs" role="tablist" aria-label="الأقسام">
      <button role="tab" id="t-reports" aria-controls="p-reports" aria-selected="true">البلاغات <span class="count" id="c-reports">٠</span></button>
      <button role="tab" id="t-review" aria-controls="p-review" aria-selected="false">المراجعة <span class="count" id="c-review">٠</span></button>
      <button role="tab" id="t-questions" aria-controls="p-questions" aria-selected="false">الأسئلة</button>
      <button role="tab" id="t-games" aria-controls="p-games" aria-selected="false">الألعاب</button>
      <button role="tab" id="t-feud" aria-controls="p-feud" aria-selected="false">أشهر إجابة</button>
      <button role="tab" id="t-brand" aria-controls="p-brand" aria-selected="false">الهوية</button>
    </nav>
  </header>
  <main>
    <p class="msg err" id="load-msg" hidden></p>
    <section id="p-reports" role="tabpanel" aria-labelledby="t-reports"></section>
    <section id="p-questions" role="tabpanel" aria-labelledby="t-questions" hidden></section>
    <section id="p-games" role="tabpanel" aria-labelledby="t-games" hidden></section>
    <section id="p-feud" role="tabpanel" aria-labelledby="t-feud" hidden></section>
    <section id="p-review" role="tabpanel" aria-labelledby="t-review" hidden></section>
    <section id="p-brand" role="tabpanel" aria-labelledby="t-brand" hidden></section>
  </main>
</div>

<dialog id="dlg" aria-labelledby="dlg-title"><form method="dialog" id="dlg-form" novalidate></form></dialog>

<script>
(function(){
"use strict";
const SB = {base:"https://bsfzfarfrnxgpckmprut.supabase.co", key:"sb_publishable_6LjuIzeMjepexKqCHCy9vQ_IcLWX4DX"};
const LS = "qahwa-admin:v1";
// end_game went live on the game pages on 1 Nov 2026; completion is only meaningful for games after this
const ENDS_FROM = Date.parse("2026-11-01T17:00:00Z");
const MIN_PER_LEVEL = 8;
const $ = id => document.getElementById(id);
const nf = new Intl.NumberFormat("ar-EG");
const pf = new Intl.NumberFormat("ar-EG", {maximumFractionDigits:1});
const fmt = n => n == null || Number.isNaN(n) ? "—" : nf.format(n);
const dtf = new Intl.DateTimeFormat("ar-EG", {day:"numeric", month:"short", hour:"numeric", minute:"2-digit"});
const df = new Intl.DateTimeFormat("ar-EG", {weekday:"long", day:"numeric", month:"long"});
const dshort = new Intl.DateTimeFormat("ar-EG", {day:"numeric", month:"short"});
const rtf = new Intl.RelativeTimeFormat("ar", {numeric:"auto"});
function ago(t){
  const s = (Date.parse(t) - Date.now()) / 1000, a = Math.abs(s);
  if (a < 60) return rtf.format(Math.round(s), "second");
  if (a < 3600) return rtf.format(Math.round(s / 60), "minute");
  if (a < 86400) return rtf.format(Math.round(s / 3600), "hour");
  if (a < 86400 * 30) return rtf.format(Math.round(s / 86400), "day");
  return dtf.format(new Date(t));
}
function h(tag, props, ...kids){
  const el = document.createElement(tag);
  if (props) for (const [k,v] of Object.entries(props)){
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "text") el.textContent = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}
const store = {
  get(){ try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch(e){ return {}; } },
  set(o){ try { localStorage.setItem(LS, JSON.stringify(o)); } catch(e){} }
};

/* ---------- auth ---------- */
let sess = null; // {access, refresh, exp, email}
async function authCall(path, body, token){
  const headers = {"apikey":SB.key, "Content-Type":"application/json"};
  if (token) headers.Authorization = "Bearer " + token;
  const r = await fetch(SB.base + "/auth/v1/" + path, {method:"POST", headers, body:JSON.stringify(body || {})});
  let j = null; try { j = await r.json(); } catch(e){}
  if (!r.ok){ const e = new Error((j && (j.error_code || j.code || j.error)) || ("http " + r.status)); e.info = j; e.status = r.status; throw e; }
  return j || {};
}
function keep(j){
  sess = {access:j.access_token, refresh:j.refresh_token, exp:Date.now() + (j.expires_in || 3600) * 1000, email:(j.user && j.user.email) || (sess && sess.email) || ""};
  store.set({refresh:sess.refresh, email:sess.email});
}
async function refresh(){
  const saved = store.get(); const rt = (sess && sess.refresh) || saved.refresh;
  if (!rt) throw new Error("no-session");
  keep(await authCall("token?grant_type=refresh_token", {refresh_token:rt}));
}
async function token(){
  if (!sess || Date.now() > sess.exp - 60000) await refresh();
  return sess.access;
}
function authError(e){
  const c = String(e.message || "");
  if (c === "invalid_credentials" || /invalid login/i.test(c)) return "الإيميل أو كلمة السر غلط.";
  if (c === "email_not_confirmed") return "أكد الإيميل الأول من الرسالة اللي وصلتلك، وبعدين ادخل.";
  if (c === "weak_password") return "كلمة السر ضعيفة. استخدم ٨ حروف على الأقل.";
  if (c === "user_already_exists" || c === "email_exists") return "الإيميل ده عليه حساب بالفعل. ادخل من «دخول».";
  if (c === "over_email_send_rate_limit" || e.status === 429) return "محاولات كتير. استنى شوية وجرب تاني.";
  return "حصلت مشكلة في الدخول. جرب تاني.";
}

/* ---------- api ---------- */
async function api(path, opts){
  opts = opts || {};
  const go = async () => fetch(SB.base + "/rest/v1" + path, {method:opts.method || "GET",
    headers:Object.assign({"apikey":SB.key, "Authorization":"Bearer " + await token(), "Content-Type":"application/json"}, opts.prefer ? {"Prefer":opts.prefer} : {}),
    body:opts.body == null ? undefined : JSON.stringify(opts.body)});
  let r = await go();

  if (!r.ok){ let t = ""; try { t = await r.text(); } catch(e){} throw new Error("api " + r.status + " " + t.slice(0, 200)); }

/* Every row of a query, a page at a time. Supabase returns at most 1,000 rows per request whatever limit is asked for,
   so a single request silently drops the rest. The order must end with a unique column so pages never overlap or skip;
   the offset moves on by the rows actually returned, and the read ends at the first empty page. A failed page fails
   the whole read (api throws), so nothing partial is ever shown as complete. With `key`, a row seen twice (the table
   changed between two pages) is kept once. */
const PAGE = 500;
async function apiAll(path, order, key){
  const sep = path.includes("?") ? "&" : "?", out = [], seen = key ? new Set() : null;
  for (let offset = 0, pages = 0; ; pages++){
    if (pages > 2000) throw new Error("too many pages: " + path.split("?")[0]);
    const rows = await api(path + sep + "order=" + order + "&limit=" + PAGE + "&offset=" + offset);
    if (!Array.isArray(rows)) throw new Error("not a list: " + path.split("?")[0]);
    if (!rows.length) return out;
    offset += rows.length;
    for (const r of rows){
      if (seen){ if (seen.has(r[key])) continue; seen.add(r[key]); }
      out.push(r);
    }
  }
}

// "key: alias، alias" per line → [{key, aliases}], or a message
function sbParse(text){
  const out = [], seen = new Map();
  for (const raw of text.split("\n")){
    const line = raw.trim(); if (!line) continue;
    const m = /^([a-z][a-z0-9_]{0,39})\s*:\s*(.*)$/.exec(line);
    if (!m) return "كل سطر يبدأ باسم المجموعة بالإنجليزي الصغير (حروف وأرقام و _) وبعده «:» وبعده الإجابات: «" + line.slice(0, 30) + "»";
    const aliases = m[2].split(/[,،]/).map(a => a.trim()).filter(Boolean);
    if (!aliases.length) return "المجموعة «" + m[1] + "» مفيهاش إجابات.";
    for (const a of aliases){
      const k = a.toLowerCase().replace(/\s+/g, " ");
      if (seen.has(k) && seen.get(k) !== m[1]) return "«" + a + "» مكتوبة في مجموعتين: " + seen.get(k) + " و" + m[1] + ".";
      seen.set(k, m[1]);
    }
    const g = out.find(x => x.key === m[1]);
    if (g) g.aliases.push(...aliases); else out.push({key:m[1], aliases});
  }
  return out;
}

/* ---------- research history: how each question was written and checked, kept in the database ----------
   A research file (made from the research batches with research_export.py) is added from here; rows already in are
   skipped, so the same file can be added again safely. */
let RES_KEYS = null;   // src_md5 of the rows in the database
let RES_MSG = null;    // the last import's message, kept across redraws of the tab
let RES_FAILED = false; // the count could not be read
function resSay(t, err){
  RES_MSG = {t, err:!!err};
  const m = $("res-msg"); if (m){ m.textContent = t; m.className = "msg" + (err ? " err" : " ok"); m.hidden = false; }
}
async function loadResearchKeys(){
  const rows = await apiAll("/research_items?select=id,src_md5", "id.asc", "id");
  RES_KEYS = new Set(rows.map(r => r.src_md5).filter(Boolean));
  if (tab === "review") renderReview();
}
function researchPanel(){
  if (RES_KEYS == null && !RES_FAILED) loadResearchKeys().then(() => { RES_FAILED = false; }, () => { RES_FAILED = true; if (tab === "review") renderReview(); });
  const msg = h("p",{class:"msg" + (RES_MSG ? (RES_MSG.err ? " err" : " ok") : ""),id:"res-msg",role:"status","aria-live":"polite",hidden:!RES_MSG}, RES_MSG ? RES_MSG.t : "");
  const input = h("input",{type:"file",accept:".json,application/json",id:"res-file"});
  input.addEventListener("change", () => { const f = input.files && input.files[0]; if (f) importResearch(f, input); });
  return h("div",{class:"panel",id:"res-panel"},
    h("div",{class:"hd"}, h("h2", null, "سجل الكتابة والمراجعة"),
      h("span",{class:"muted small"}, RES_FAILED ? "ماقدرناش نعرف عدد العناصر. اضغط «تحديث»." : RES_KEYS == null ? "بيحمّل…" : "في قاعدة البيانات " + fmt(RES_KEYS.size) + " عنصر: مسودات الكتّاب، وحكم المراجع وملاحظاته، واللي اترفض وسببه.")),
    h("div",{class:"bd"}, h("label",{class:"field"}, h("span", null, "إضافة ملف سجل البحث (research_….json)"), input), msg));
}
async function importResearch(file, input){
  const say = resSay;
  let doc = null;
  try { doc = JSON.parse(await file.text()); } catch(e){}
  if (!doc || doc.kind !== "quiz-research" || !Array.isArray(doc.items) || !Array.isArray(doc.batches)){ say("الملف ده مش ملف سجل بحث.", true); return; }
  input.disabled = true;
  try {
    if (RES_KEYS == null) await loadResearchKeys();
    await api("/research_batches?on_conflict=dir", {method:"POST", body:doc.batches, prefer:"resolution=ignore-duplicates,return=minimal"});
    const todo = doc.items.filter(x => x && x.src_md5 && !RES_KEYS.has(x.src_md5));
    let added = 0, failed = 0;
    const put = rows => api("/research_items?on_conflict=src_md5", {method:"POST", body:rows, prefer:"resolution=ignore-duplicates,return=minimal"});
    for (let i = 0; i < todo.length; i += 100){
      const part = todo.slice(i, i + 100);
      try { await put(part); added += part.length; }
      catch(e){
        // one row at a time; a row pointing at a question that is gone goes in without the link
        for (const x of part){
          try { await put([x]); added++; }
          catch(e2){ try { await put([Object.assign({}, x, {question_id:null, feud_round_id:null})]); added++; } catch(e3){ failed++; } }
        }
      }
      say("اتضاف " + fmt(added) + " من " + fmt(todo.length) + "…");
    }
    RES_KEYS = null; await loadResearchKeys();
    say("اتضاف " + fmt(added) + (doc.items.length - todo.length ? "، و" + fmt(doc.items.length - todo.length) + " كانوا موجودين قبل كده" : "") + (failed ? "، وماقدرناش نضيف " + fmt(failed) : "") + ".", failed > 0);
  } catch(e){ say("ماقدرناش نضيف الملف. جرب تاني.", true); }
  finally { input.disabled = false; }
}

    cropper.addEventListener("pointermove", e => { if (!start) return; st.crop = toCrop(start, at(e)); draw(); });
    cropper.addEventListener("pointerup", e => { if (!start) return; st.crop = toCrop(start, at(e)); start = null; draw(); if (api_.onCrop) api_.onCrop(); });
    clearCrop.addEventListener("click", () => { st.crop = null; draw(); if (api_.onCrop) api_.onCrop(); });
    window.addEventListener("resize", draw);
  }
  draw();
  return api_;
}
function newQuestion(){
  const cats = D.cats.filter(c => inBrand(brandsOfPack(c.pack_id)));
  if (!cats.length) return;
  editQuestion({id:null, category_id:qFilter.cat && D.catById[qFilter.cat] ? qFilter.cat : cats[0].id, level:Number(qFilter.level) || 1, question:"", answer:"",
    accepted_answers:[], wrong_options:[], host_note:null, media_url:null, reveal_media_url:null, status:"verified", version:1}, false);
}
function editQuestion(q, fromReport){
  const isNew = !q.id;
  const s = D.qstat[q.id] || {}, f = D.fstat[q.id] || {};
  const wrong = (q.wrong_options || []).concat(["","",""]).slice(0, 3);
  const srcBox = h("ol",{class:"srcs"}, h("li",{class:"muted"}, isNew ? "مفيش مصادر لسه." : "بيحمّل المصادر…"));
  const resBox = h("div",{class:"checks"});
  const qPic = picField("صورة السؤال (اختياري)", "لو حطيت صورة بتظهر كبيرة تحت السؤال على الشاشة وعلى الموبايلات. اكتب السؤال نفسه برضه، زي «ما الدولة المظلّلة على الخريطة؟».", q.media_url, true);
  const rPic = picField("صورة الإجابة (اختياري)", "بتظهر مكان صورة السؤال لما الإجابة تظهر. من غيرها بتفضل صورة السؤال.", q.reveal_media_url, false);
  const whole = h("input",{type:"checkbox",id:"e-whole",checked:true});
  const wholeRow = h("label",{class:"check",hidden:true}, whole, " الصورة كاملة تظهر مع الإجابة");
  const syncWhole = () => {
    const on = qPic.cropped();
    wholeRow.hidden = !on;
    if (on && whole.checked) rPic.setImage(qPic.image(), qPic.image().src); else rPic.clearIfFromOther();
  };
  qPic.onCrop = syncWhole; whole.addEventListener("change", syncWhole);
  const catSel = isNew ? h("label",{class:"field"}, h("span", null, "الفئة"), h("select",{id:"e-cat"},
    D.cats.filter(c => inBrand(brandsOfPack(c.pack_id))).map(c => h("option",{value:c.id, selected:c.id === q.category_id ? true : null},
      c.name + (brand === "all" ? " (" + brandsOfPack(c.pack_id).map(brandName).join("، ") + ")" : ""))))) : null;
  if (!isNew) api("/research_items?select=verdict,notes,dir&question_id=eq." + q.id).then(rows => {
    resBox.replaceChildren(...rows.filter(r => r.verdict || r.notes).map(r => h("p", null, h("span",{class:"tag" + (r.verdict === "ok" ? " ok" : r.verdict === "fixed" ? " warn" : " bad")}, VERDICT[r.verdict] || r.verdict || "مراجعة"), " ", r.notes || "")));
  }).catch(() => {});
  if (!isNew) api("/sources?select=url,title,checked_on&question_id=eq." + q.id).then(rows => {
    srcBox.replaceChildren(...(rows.length ? rows.map(r => h("li", null, h("a",{href:r.url,target:"_blank",rel:"noopener noreferrer"}, r.title || r.url), h("span",{class:"muted"}, " · اتراجع " + r.checked_on))) : [h("li",{class:"muted"}, "مفيش مصادر مسجلة.")]));
  }).catch(() => srcBox.replaceChildren(h("li",{class:"muted"}, "ماقدرناش نحمّل المصادر.")));
  openDialog([
    h("div",{class:"hd"}, h("h2",{id:"dlg-title"}, isNew ? "سؤال جديد" : fromReport ? "تعديل سؤال عليه بلاغ" : "تعديل سؤال"),
      isNew ? null : h("span",{class:"muted small"}, catName(q.category_id) + " · إصدار " + fmt(q.version) + " · اتلعب " + fmt(s.shown || 0) + " · إعجاب " + fmt(f.likes || 0) + " / " + fmt(f.dislikes || 0))),
    catSel,
    h("label",{class:"field"}, h("span", null, "السؤال"), h("textarea",{id:"e-q",rows:"3"}, q.question)),
    qPic.box, wholeRow, rPic.box,
    h("div",{class:"row2"},
      h("label",{class:"field"}, h("span", null, "الإجابة"), h("input",{type:"text",id:"e-a",value:q.answer})),
      h("label",{class:"field"}, h("span", null, "إجابات مقبولة كمان (افصل بـ ،)"), h("input",{type:"text",id:"e-acc",value:(q.accepted_answers || []).join("، ")}))),
    h("div",{class:"field"}, h("span", null, "الاختيارات الغلط (لسباق السرعة)"), h("div",{class:"row3"}, wrong.map((w,i) => h("input",{type:"text",id:"e-w" + i,value:w,"aria-label":"اختيار غلط " + fmt(i + 1)})))),
    h("label",{class:"field"}, h("span", null, "ملاحظة للمقدم"), h("textarea",{id:"e-n",rows:"2"}, q.host_note || "")),
    h("div",{class:"row2"}, levelSelect("e-l", q.level), fromReport ? h("div") : statusSelect("e-s", q.status)),
    isNew ? null : h("div",{class:"field"}, h("span", null, "المصادر"), srcBox),
    isNew ? null : h("div",{class:"field review"}, resBox),
    h("p",{class:"muted small"}, isNew ? "لو الحالة «شغال» السؤال بيدخل اللعب من أول لعبة جديدة. «مستني مراجعة» بيستناك في المراجعة." : "التعديل بيوصل للعب من أول لعبة جديدة."),
    footer(fromReport, {
      check(){
        const qq = $("e-q").value.trim(), a = $("e-a").value.trim(), w = [0,1,2].map(i => $("e-w" + i).value.trim());
        if (!qq) return "اكتب السؤال.";
        if (!a) return "اكتب الإجابة.";
        if (w.some(x => !x)) return "اكتب التلات اختيارات الغلط.";
        if (new Set([a, ...w]).size !== 4) return "الاختيارات لازم تبقى مختلفة عن بعض وعن الإجابة.";
        const bad = qPic.bad() || rPic.bad(); if (bad) return bad;
        if (rPic.has() && !qPic.has()) return "صورة الإجابة محتاجة صورة للسؤال.";
        return "";
      },
      async run(){
        // pictures first: if an upload fails nothing is saved
        const img = await qPic.result(), rimg = img ? await rPic.result() : null;
        const body = {question:$("e-q").value.trim(), answer:$("e-a").value.trim(), accepted_answers:splitList($("e-acc").value),
          wrong_options:[0,1,2].map(i => $("e-w" + i).value.trim()), host_note:$("e-n").value.trim() || null, level:Number($("e-l").value),
          media_url:img || null, reveal_media_url:rimg || null};
        if (!fromReport) body.status = $("e-s").value;
        if (isNew){
          Object.assign(body, {category_id:$("e-cat").value, language:"ar", dialect:"msa", family_safe:true, batch:"admin-" + new Date().toISOString().slice(0, 10)});
          if (body.status === "verified") Object.assign(body, approvedBy());
          await api("/questions", {method:"POST", body, prefer:"return=minimal"});
          return;
        }
        if (body.status === "verified" && q.status === "draft") Object.assign(body, approvedBy());
        await api("/questions?id=eq." + q.id, {method:"PATCH", body, prefer:"return=minimal"});
        if (fromReport) await rpc("admin_resolve", {p_kind:"question", p_item:q.id, p_action:"fixed"});
      }
    })
  ]);
}
function editRound(r, fromReport){
  const rows = h("div",{style:"display:grid;gap:8px"});
  const addRow = a => {
    const row = h("div",{class:"arow"},
      h("input",{type:"text",class:"t",value:a ? a.text : "","aria-label":"الإجابة"}),
      h("input",{type:"number",class:"p",min:"1",max:"100",value:a ? a.pts : "","aria-label":"النقط"}),
      h("input",{type:"text",class:"alt",value:a && a.alt ? a.alt.join("، ") : "","aria-label":"مرادفات مقبولة",placeholder:"مرادفات (افصل بـ ،)"}),
      h("button",{class:"btn",type:"button","aria-label":"احذف الإجابة",onclick:() => row.remove()}, "حذف"));
    rows.append(row);
  };
  (r.answers || []).forEach(addRow);
  openDialog([
    h("div",{class:"hd"}, h("h2",{id:"dlg-title"}, fromReport ? "تعديل جولة عليها بلاغ" : "تعديل جولة"), h("span",{class:"muted small"}, "إصدار " + fmt(r.version))),
    h("label",{class:"field"}, h("span", null, "السؤال"), h("input",{type:"text",id:"r-p",value:r.prompt})),
    h("div",{class:"row2"}, levelSelect("r-l", r.level), fromReport ? h("div") : statusSelect("r-s", r.status)),
    h("div",{class:"field"}, h("span", null, "الإجابات والنقط والمرادفات"), rows, h("div", null, h("button",{class:"btn",type:"button",onclick:() => addRow(null)}, "إضافة إجابة"))),
    footer(fromReport, {
      read(){ return [...rows.querySelectorAll(".arow")].map(x => ({text:x.querySelector(".t").value.trim(), pts:Number(x.querySelector(".p").value), alt:splitList(x.querySelector(".alt").value)})); },
      check(){
        if (!$("r-p").value.trim()) return "اكتب السؤال.";
        const a = this.read();
        if (a.length < 3 || a.length > 10) return "الجولة لازم يبقى فيها من ٣ لـ ١٠ إجابات.";
        if (a.some(x => !x.text || !Number.isInteger(x.pts) || x.pts < 1)) return "كل إجابة محتاجة نص ونقط (رقم صحيح).";
        if (new Set(a.map(x => x.text)).size !== a.length) return "فيه إجابة متكررة.";
        return "";
      },
      async run(){
        const answers = this.read().sort((x,y) => y.pts - x.pts);
        const body = {prompt:$("r-p").value.trim(), level:Number($("r-l").value), answers};
        if (!fromReport) body.status = $("r-s").value;
        if (body.status === "verified" && r.status === "draft") Object.assign(body, reviewedBy());
        await api("/feud_rounds?id=eq." + r.id, {method:"PATCH", body, prefer:"return=minimal"});
        if (fromReport) await rpc("admin_resolve", {p_kind:"feud", p_item:r.id, p_action:"fixed"});
      }
    })
  ]);
}

/* ---------- views ---------- */
function view(name){ $("v-signin").hidden = name !== "signin"; $("v-denied").hidden = name !== "denied"; $("v-app").hidden = name !== "app"; }
let mode = "in";
function setMode(m){
  mode = m;
  $("m-in").setAttribute("aria-pressed", String(m === "in")); $("m-up").setAttribute("aria-pressed", String(m === "up"));
  $("in-go").textContent = m === "in" ? "ادخل" : "اعمل الحساب";
  $("in-pass").setAttribute("autocomplete", m === "in" ? "current-password" : "new-password");
  $("in-msg").hidden = true;
}
function say(text, ok){ const m = $("in-msg"); m.textContent = text; m.className = "msg " + (ok ? "ok" : "err"); m.hidden = false; }
async function enter(){
  let ok = false;
  try { ok = await rpc("is_admin"); } catch(e){ ok = false; }
  if (ok !== true){ $("denied-who").textContent = sess.email; view("denied"); return; }
  $("who").textContent = sess.email; view("app"); setTab(tab);
  try { await load(); } catch(e){ showLoadErr(LOAD_FAILED); }
}
async function signOut(){
  try { if (sess) await authCall("logout", {}, sess.access); } catch(e){}
  sess = null; store.set({}); setMode("in"); view("signin");
}
$("m-in").addEventListener("click", () => setMode("in"));
$("m-up").addEventListener("click", () => setMode("up"));
$("f-signin").addEventListener("submit", async e => {
  e.preventDefault();
  const email = $("in-email").value.trim().toLowerCase(), password = $("in-pass").value;
  if (!email || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return say("اكتب إيميل صحيح.");
  if (password.length < 8 && mode === "up") return say("كلمة السر لازم ٨ حروف على الأقل.");
  if (!password) return say("اكتب كلمة السر.");
  $("in-go").disabled = true;
  try {
    if (mode === "up"){
      const j = await authCall("signup", {email, password});
      if (j.access_token){ keep(j); await enter(); }
      else { setMode("in"); $("in-email").value = email; $("in-pass").value = ""; say("بعتنالك رسالة تأكيد على الإيميل. افتحها واضغط على الرابط، وبعدين ادخل من هنا. لو الرابط فتح صفحة مش شغالة، عادي، الحساب اتأكد.", true); }
    } else {
      keep(await authCall("token?grant_type=password", {email, password}));
      $("in-pass").value = "";
      await enter();
    }
  } catch(err){ say(authError(err)); }
  finally { $("in-go").disabled = false; }
});
$("b-out").addEventListener("click", signOut);
$("denied-out").addEventListener("click", signOut);
$("b-reload").addEventListener("click", async () => { $("b-reload").disabled = true; try { await load(); } catch(e){ showLoadErr(LOAD_FAILED); } $("b-reload").disabled = false; });
for (const k of ["reports","review","questions","games","feud","brand"]) $("t-" + k).addEventListener("click", () => setTab(k));
$("dlg").addEventListener("close", () => form.replaceChildren());

(async () => {
  setMode("in");
  const saved = store.get();
  if (saved.refresh){
    try { await refresh(); await enter(); return; } catch(e){ store.set({}); }
  }
  view("signin");
})();
})();
</script>
