<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A2E35">
<title>نفس الدماغ · قهوة الطيبين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marhey:wght@500;700&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
/* «نفس الدماغ»: the café's own colours (teal walls, cream cups, orange signs, yellow points) with one new thing in them,
   thought bubbles: the prompt is a big one, every answer a small one, and answers that think alike sit together under
   a pink brain. The page only shows what the database sends this seat; every rule is checked there. */
:root{
  --night:#0A2E35; --stage:#0E3B43; --panel:#0F3F47; --panel-2:#14505A; --ray:#124A53;
  --line:rgba(255,244,220,.14); --line-2:rgba(255,244,220,.32);
  --cream:#FFF4DC; --cream-2:#F6E7C4; --ink:#10222A; --ink-2:#53646A; --muted:#A9D2CF;
  --sign:#F2672E; --sign-deep:#B6461A; --brass:#FFC93C; --brass-deep:#C7861A;
  --pink:#F4A7B9; --pink-deep:#C2577A; --host:#8FD3F4; --host-deep:#4E8FB0; --good:#2FB36B; --bad:#FF8A7A;
  --a0:#F2672E; --a1:#E8558A; --a2:#4FA3E0; --a3:#3CC07A; --a4:#A47CF3; --a5:#2EC4B6; --a6:#FFC93C; --a7:#F4A7B9;
  --f-show:"Marhey","Readex Pro",system-ui,Tahoma,sans-serif;
  --f-body:"Readex Pro",system-ui,"Segoe UI",Tahoma,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{
  background:repeating-conic-gradient(from 0deg at 50% -8%,var(--stage) 0deg 9deg,var(--ray) 9deg 18deg) fixed,var(--night);
  background-color:var(--night);
  color:var(--cream);font-family:var(--f-body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
body::before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(10,46,53,.35),var(--night) 55%);pointer-events:none;z-index:-1}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brass);outline-offset:3px}
.app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;gap:14px;
  padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(max(16px,env(safe-area-inset-bottom,0px)) + 8px) max(16px,env(safe-area-inset-left,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{margin:0;display:flex;align-items:center;gap:8px;font-family:var(--f-show);font-weight:700;font-size:1.5rem;line-height:1.1;color:var(--cream)}
.logo small{display:block;font-family:var(--f-body);font-weight:400;font-size:.76rem;color:var(--muted)}
.logo .brain{width:38px;height:34px;flex:none}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:32px}
.who{display:flex;align-items:center;gap:6px;min-width:0;font-size:.88rem;color:var(--muted);margin-inline-start:auto}
.who b{color:var(--cream);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:9em}
.lang{min-width:44px;min-height:40px;border-radius:12px;border:1px solid var(--line-2);background:transparent;cursor:pointer;font-weight:600;font-size:.9rem}
.badge{font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--host);color:var(--ink);white-space:nowrap}
.status{margin:0;font-size:.95rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;min-width:0}
.status b{color:var(--cream);font-weight:600}
.net{align-self:center;font-size:.85rem;padding:4px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line-2);color:var(--muted)}
main{flex:1;display:flex;flex-direction:column;gap:14px}
.view{display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px}
h1,h2,h3{margin:0;font-family:var(--f-show);font-weight:700;line-height:1.3}
h1{font-size:2.2rem} h2{font-size:1.4rem} h3{font-size:1.1rem}
p{margin:0}
.lead{font-size:1.06rem}
.muted{color:var(--muted)}
.small{font-size:.88rem}
label{font-size:.9rem;color:var(--muted)}
input{width:100%;background:var(--night);border:1px solid var(--line-2);border-radius:14px;padding:13px 14px;font-size:1.12rem;color:var(--cream)}
input:focus{outline:none;border-color:var(--brass);box-shadow:0 0 0 3px rgba(255,201,60,.28)}
.codein{font-family:var(--f-show);font-size:1.9rem;letter-spacing:.25em;text-align:center;direction:ltr;font-variant-numeric:tabular-nums}
.field{display:flex;flex-direction:column;gap:6px}
.namebox{display:flex;gap:8px}
.namebox input{flex:1;min-width:0}
.dice{flex:none;width:52px;border-radius:14px;border:1px solid var(--line-2);background:var(--panel-2);cursor:pointer;font-size:1.4rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:12px 20px;border-radius:16px;border:0;cursor:pointer;
  font-family:var(--f-show);font-weight:700;font-size:1.2rem;line-height:1.2;text-align:center;width:100%;
  background:var(--sign);color:var(--cream);box-shadow:0 4px 0 var(--sign-deep)}
.btn:active:not([disabled]){transform:translateY(2px);box-shadow:0 2px 0 var(--sign-deep)}
.btn[disabled]{opacity:.45;cursor:default;box-shadow:none}
.btn.ghost{background:transparent;color:var(--cream);border:1px solid var(--line-2);box-shadow:none;font-family:var(--f-body);font-weight:500;font-size:1rem;min-height:48px}
.btn.host{background:var(--host);color:var(--ink);box-shadow:0 4px 0 var(--host-deep)}
.btn.brass{background:var(--brass);color:var(--ink);box-shadow:0 4px 0 var(--brass-deep)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid rgba(255,138,122,.5);box-shadow:none;font-family:var(--f-body);font-weight:500;font-size:.95rem;min-height:46px}
.btn.sure{background:var(--bad);color:var(--ink)}
.btn.small{min-height:44px;font-size:.95rem;padding:8px 14px;width:auto}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 0;min-width:0}
.msg{margin:0;font-size:.95rem;color:var(--bad)}
.msg:empty{display:none}
.note{margin:0;font-size:.92rem;color:var(--muted);text-align:center}
.note:empty{display:none}
/* the brain, and thought bubbles */
.brain{display:inline-block;flex:none}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:8px 6px 2px}
.hero .brain{width:112px;height:100px}
.hero h1{font-size:2.5rem;color:var(--cream)}
.hero p{font-size:1.1rem;max-width:22em}
.thought{position:relative;background:var(--cream);color:var(--ink);border-radius:34px;padding:20px 22px 22px;margin:4px 0 40px;box-shadow:0 8px 0 rgba(0,0,0,.2)}
.thought::before,.thought::after{content:"";position:absolute;background:var(--cream);border-radius:50%;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.thought::before{width:24px;height:24px;inset-inline-start:46px;bottom:-20px}
.thought::after{width:13px;height:13px;inset-inline-start:30px;bottom:-38px}
.thought .q{font-family:var(--f-show);font-weight:700;font-size:1.45rem;line-height:1.5;overflow-wrap:anywhere}
.thought .k{font-size:.85rem;color:var(--ink-2);margin-bottom:6px}
.thought.sm{border-radius:26px;padding:14px 18px;margin-bottom:32px}
.thought.sm .q{font-size:1.12rem}
.thought.sm::before{width:18px;height:18px;bottom:-16px;inset-inline-start:36px}
.thought.sm::after{width:10px;height:10px;bottom:-30px;inset-inline-start:24px}
.secret{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:16px;background:rgba(244,167,185,.12);border:1px solid rgba(244,167,185,.4);font-size:.95rem}
/* avatars */
.av{--c:var(--a0);width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--c);color:var(--ink);
  font-family:var(--f-show);font-weight:700;font-size:1.15rem;line-height:1;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.av.sm{width:28px;height:28px;font-size:.85rem}
.av.xs{width:22px;height:22px;font-size:.72rem}
/* the roster and the scores */
.roster{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.roster li{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:14px;background:var(--panel-2);min-height:56px}
.roster .nm{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500}
.roster .tag{font-size:.8rem;color:var(--muted)}
.roster .tag.off{color:var(--bad)}
.roster li.me{outline:2px solid var(--line-2)}
.roster li.dim{opacity:.6}
.roster .pts{font-family:var(--f-show);font-weight:700;font-size:1.3rem;color:var(--brass);min-width:1.4em;text-align:center}
.roster .rank{font-family:var(--f-show);font-weight:700;color:var(--muted);width:1.5em;text-align:center}
.roster .plus{font-size:.85rem;font-weight:600;color:var(--pink)}
.rm{width:44px;height:44px;border-radius:12px;border:1px solid var(--line-2);background:transparent;color:var(--muted);cursor:pointer;font-size:1.2rem;flex:none}
.dot{width:10px;height:10px;border-radius:50%;background:var(--good);flex:none}
.dot.off{background:var(--bad)}
/* lobby */
.join{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.qr{width:132px;height:132px;background:#fff;border-radius:14px;padding:6px}
.qr svg{display:block;width:100%;height:100%}
.bigcode{font-family:var(--f-show);font-weight:700;font-size:2.4rem;letter-spacing:.12em;direction:ltr;color:var(--brass);line-height:1}
.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.rules li{display:flex;gap:10px;align-items:flex-start;font-size:.95rem}
.rules li::before{content:"";flex:none;width:12px;height:12px;margin-top:.45em;border-radius:50%;background:var(--cream)}
.rules li:nth-child(2)::before{background:var(--pink)}
.rules li:nth-child(3)::before{background:var(--brass)}
/* answering */
.count{font-size:.85rem;color:var(--muted);text-align:end;font-variant-numeric:tabular-nums}
.count.over{color:var(--bad);font-weight:600}
.mine{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.mine .ans{align-self:flex-start}
.progress{display:flex;flex-direction:column;gap:10px}
.prog-n{font-family:var(--f-show);font-weight:700;font-size:1.25rem}
.chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.chips li{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border-radius:999px;background:var(--panel-2);font-size:.92rem;min-height:40px}
[dir="rtl"] .chips li{padding:6px 6px 6px 10px}
.chips .st{font-size:.8rem;color:var(--muted)}
.chips li.in{background:rgba(47,179,107,.18);outline:1px solid rgba(47,179,107,.5)}
.chips li.in .st{color:#8FE0B4}
.chips li.out{opacity:.65;text-decoration:line-through}
.chips .x{min-height:36px;border-radius:999px;border:1px solid rgba(255,138,122,.5);background:transparent;color:var(--bad);font-size:.8rem;padding:4px 10px;cursor:pointer}
.chips .x.sure{background:var(--bad);color:var(--ink)}
/* the reveal: answers as bubbles, grouped */
.groups{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.grp{border-radius:22px;padding:12px;background:var(--panel);border:2px dashed var(--line-2);display:flex;flex-direction:column;gap:10px}
.grp.match{border:2px solid var(--pink);background:linear-gradient(180deg,rgba(244,167,185,.16),var(--panel) 70%)}
.grp.pick{box-shadow:0 0 0 4px rgba(255,201,60,.5);border-color:var(--brass)}
.grp .head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.85rem;font-weight:600;white-space:nowrap}
.chip.match{background:var(--pink);color:var(--ink)}
.chip.uniq{background:transparent;border:1px solid var(--line-2);color:var(--cream)}
.chip.merged{background:transparent;border:1px solid var(--pink);color:var(--pink)}
.chip.prov{background:transparent;color:var(--muted);font-weight:500}
.chip .brain{width:20px;height:18px}
.grp .tools{margin-inline-start:auto;display:flex;gap:6px}
.bubbles{display:flex;flex-wrap:wrap;gap:10px}
.ans{position:relative;display:flex;flex-direction:column;gap:2px;max-width:100%;background:var(--cream);color:var(--ink);border-radius:20px;padding:9px 14px 8px}
.ans .t{font-family:var(--f-show);font-weight:700;font-size:1.12rem;line-height:1.35;overflow-wrap:anywhere}
.ans .by{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--ink-2)}
.ans .by .plus{color:var(--pink-deep);font-weight:700}
.ans.me{box-shadow:0 0 0 3px var(--brass)}
.grp.match .ans{animation:pop .32s cubic-bezier(.2,.9,.3,1.3) both}
.grp .ans{animation:pop .32s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes pop{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
.aside{font-size:.92rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.aside b{color:var(--cream);font-weight:600}
.tip{font-size:.88rem;color:var(--muted);padding:10px 12px;border-radius:14px;border:1px dashed var(--line-2)}
/* the badge */
.bdg{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:20px;background:var(--pink);color:var(--ink)}
.bdg .brain{width:64px;height:58px}
.bdg h3{font-size:1.3rem}
/* the host's controls, and banners */
.hostbar{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:18px;border:2px dashed rgba(143,211,244,.55);background:rgba(143,211,244,.06)}
.hostbar .lbl{font-size:.8rem;color:var(--host);font-weight:600}
#hb-more>*{flex:1 1 40%;width:auto}
.banner{padding:12px 14px;border-radius:16px;font-size:.95rem;display:flex;flex-direction:column;gap:10px}
.banner.pause{background:var(--brass);color:var(--ink)}
.banner.pause h2{font-size:1.3rem}
.banner.warn{background:rgba(255,138,122,.12);border:1px solid rgba(255,138,122,.45)}
.win{font-family:var(--f-show);font-weight:700;font-size:1.5rem;line-height:1.4;color:var(--brass)}
.toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;max-width:488px;margin:0 auto;padding:12px 16px;border-radius:14px;background:var(--cream);color:var(--ink);font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.foot{text-align:center;font-size:.8rem;color:var(--muted)}
.foot a{color:var(--muted)}
@media (prefers-reduced-motion:reduce){.ans,.grp .ans{animation:none}.btn:active:not([disabled]){transform:none}}
@media (max-width:360px){.join{grid-template-columns:1fr;justify-items:center;text-align:center}.thought .q{font-size:1.3rem}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1 class="logo"><span class="brain" data-brain></span><span><span data-t="title"></span><small>قهوة الطيبين</small></span></h1>
    <button class="lang" type="button" id="lang" lang="en">EN</button>
  </header>
  <div class="bar" id="bar" hidden><p class="status" id="status" aria-live="polite"></p><div class="who" id="who"></div></div>
  <p class="net" id="net" role="status" hidden></p>
  <div class="banner pause" id="paused" role="status" hidden><h2 data-t="paused_h"></h2><p data-t="paused_p"></p></div>
  <div class="banner warn" id="away" role="status" hidden><p id="away-t"></p><button class="btn host" type="button" id="takeover" data-t="takeover"></button></div>

  <main>
    <!-- start: create a game or join one -->
    <section class="view" id="v-start" hidden>
      <div class="hero">
        <span class="brain" data-brain></span>
        <h1><span data-t="title"></span> <span aria-hidden="true">🧠</span></h1>
        <p data-t="tagline"></p>
      </div>
      <form class="card" id="f-join" novalidate>
        <h2 id="join-h"></h2>
        <div class="field" id="join-code-f"><label for="in-code" data-t="code_l"></label><input id="in-code" class="codein" inputmode="numeric" autocomplete="off" maxlength="5" pattern="[0-9]*"></div>
        <div class="field"><label for="in-name" data-t="name_l"></label>
          <div class="namebox"><input id="in-name" maxlength="20" autocomplete="nickname" enterkeyhint="go"><button class="dice" type="button" id="roll-j" data-t-aria="roll">🎲</button></div></div>
        <p class="msg" id="join-msg" role="alert"></p>
        <button class="btn" type="submit" id="join-go" data-t="join_go"></button>
      </form>
      <form class="card" id="f-create" novalidate>
        <h2 data-t="create_h"></h2>
        <div class="field"><label for="in-hname" data-t="name_l"></label>
          <div class="namebox"><input id="in-hname" maxlength="20" autocomplete="nickname" enterkeyhint="go"><button class="dice" type="button" id="roll-c" data-t-aria="roll">🎲</button></div></div>
        <p class="msg" id="create-msg" role="alert"></p>
        <button class="btn" type="submit" id="create-go" data-t="create_go"></button>
      </form>
      <div class="card"><ul class="rules"><li data-t="how1"></li><li data-t="how2"></li><li data-t="how3"></li></ul></div>
    </section>

    <!-- lobby -->
    <section class="view" id="v-lobby" hidden>
      <div class="card" id="l-in" hidden>
        <p class="lead" data-t="ask_in"></p>
        <button class="btn" type="button" id="l-ready" data-t="im_in"></button>
      </div>
      <div class="card">
        <div class="join">
          <div class="qr" id="qr" role="img" data-t-aria="qr_aria"></div>
          <div>
            <p class="muted small" data-t="code_l"></p>
            <p class="bigcode" id="l-code"></p>
            <p class="muted small" data-t="scan"></p>
          </div>
        </div>
        <button class="btn ghost" type="button" id="l-share" data-t="share"></button>
      </div>
      <div class="card">
        <h3 id="l-count"></h3>
        <ul class="roster" id="l-roster"></ul>
        <p class="note" id="l-why"></p>
        <form class="namebox" id="f-rename" hidden novalidate>
          <input id="in-rename" maxlength="20" autocomplete="nickname" data-t-aria="rename">
          <button class="btn small ghost" type="submit" data-t="rename_save"></button>
        </form>
        <button class="btn ghost" type="button" id="l-rename" data-t="rename"></button>
      </div>
      <div class="card"><ul class="rules"><li data-t="how1"></li><li data-t="how2"></li><li data-t="how4"></li></ul></div>
    </section>

    <!-- waiting for the next game -->
    <section class="view" id="v-wait" hidden>
      <div class="card"><h2 data-t="waiting_h"></h2><p data-t="waiting_p"></p></div>
    </section>

    <!-- answering -->
    <section class="view" id="v-answer" hidden>
      <div class="thought" id="a-prompt"><p class="q" id="a-q"></p></div>
      <p class="secret"><span aria-hidden="true">🤫</span><span data-t="secret"></span></p>
      <p class="note" id="a-repeat" hidden></p>
      <form class="card" id="f-answer" novalidate>
        <div class="field"><label for="in-answer" data-t="answer_l"></label>
          <input id="in-answer" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="send">
          <p class="count" id="a-count" aria-live="polite"></p></div>
        <p class="muted small" data-t="one_answer"></p>
        <p class="msg" id="a-msg" role="alert"></p>
        <button class="btn" type="submit" id="a-send" data-t="send"></button>
        <button class="btn ghost" type="button" id="a-skip" data-t="skip"></button>
        <button class="btn ghost" type="button" id="a-cancel" data-t="cancel" hidden></button>
      </form>
      <div class="card mine" id="a-mine" hidden>
        <p class="muted small" data-t="mine_l"></p>
        <div class="ans me" id="a-mine-b"><span class="t" id="a-mine-t"></span></div>
        <p id="a-mine-skip" data-t="mine_skip" hidden></p>
        <button class="btn ghost" type="button" id="a-edit"></button>
      </div>
      <div class="card" id="a-out" hidden><p id="a-out-t"></p></div>
      <div class="card progress">
        <p class="prog-n" id="a-n" aria-live="polite"></p>
        <ul class="chips" id="a-chips"></ul>
      </div>
    </section>

    <!-- reveal and review -->
    <section class="view" id="v-reveal" hidden>
      <div class="thought sm"><p class="q" id="r-q"></p></div>
      <div class="bdg" id="r-badge" hidden><span class="brain" data-brain></span><div><h3 data-t="badge_h"></h3><p id="r-badge-p"></p></div></div>
      <p class="note" id="r-prov"></p>
      <p class="tip" id="r-tip" hidden></p>
      <ul class="groups" id="r-groups"></ul>
      <p class="aside" id="r-skips" hidden></p>
      <p class="aside" id="r-outs" hidden></p>
      <div class="card" id="r-scores" hidden><h3 data-t="scores_h"></h3><ul class="roster" id="r-board"></ul></div>

      <button class="btn ghost" type="button" id="f-leave" data-t="leave"></button>

    <!-- a voided prompt -->
    <section class="view" id="v-voided" hidden>
      <div class="card"><h2 data-t="voided_h"></h2><p data-t="voided_p"></p></div>
    </section>

    <!-- the host's controls (only on the host's phone) -->
    <div class="hostbar" id="hostbar" hidden>

      <p class="note" id="hb-why"></p>
      <button class="btn host" type="button" id="hb-go"></button>
      <div class="row" id="hb-more"></div>
    </div>
    <p class="note" id="wait-host" hidden></p>
    <button class="btn ghost" type="button" id="leave" data-t="leave" hidden></button>

/* Live room over Supabase Realtime "broadcast" (Phoenix websocket protocol, vsn 1.0.0).
   Shared by the host screen and the phone page. Nothing is stored: messages only pass between the open pages.
   Reconnects on its own (phones sleep, networks drop) and re-sends what was queued while it was down. */

  // opts: {topic, onMessage(event, payload), onStatus(status)}; status is "connecting" | "open" | "down" | "refused"

  let url = "wss://bsfzfarfrnxgpckmprut.supabase.co/realtime/v1/websocket?" + QUERY;

    if (o && /^ws:\/\/(127\.0\.0\.1|localhost)(:\d+)?\/[^?#]*$/.test(o)) url = o + "?" + QUERY;
  } catch(e){}
  const topic = "realtime:" + opts.topic;

    ws = sock;
    sock.onopen = () => {
      if (ws !== sock) return;
      joinRef = nextRef();
      raw({topic, event:"phx_join", payload:{config:{broadcast:{self:false, ack:false}, presence:{key:""}, private:false}}, ref:joinRef, join_ref:joinRef});
      clearInterval(hb);
      hb = setInterval(() => raw({topic:"phoenix", event:"heartbeat", payload:{}, ref:nextRef()}), 25000);
    };
    sock.onmessage = ev => {
      if (ws !== sock) return;
      let m; try { m = JSON.parse(ev.data); } catch(e){ return; }

      if (m.event === "phx_reply" && m.ref === joinRef){

    if (closed) return;

    if (waiting.length > 40) waiting.shift();

    // called when the page comes back to the foreground: reconnect now instead of waiting for the backoff

    if (!ws || ws.readyState > 1){ retry = 0; connect(); }

  function close(){
    closed = true; clearTimeout(timer); clearInterval(hb); joined = false;
    try { if (ws) ws.close(); } catch(e){}
    ws = null;
  }
  connect();
  return {send, wake, close, isOpen: () => joined};

  if (props) for (const [k,v] of Object.entries(props)){
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.setAttribute("style", v);
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}

async function rpc(fn, args){
  let r;
  try { r = await fetch(SB_URL + "/rest/v1/rpc/" + fn, {method:"POST", headers:{"apikey":SB_KEY, "Authorization":"Bearer " + SB_KEY, "Content-Type":"application/json"}, body:JSON.stringify(args)}); }
  catch(e){ const x = new Error("net"); x.code = "net"; throw x; }
  const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch(e){}
  if (!r.ok){ const m = j && /sb:([a-z_]+)/.exec(j.message || ""); const x = new Error(m ? m[1] : "net"); x.code = m ? m[1] : "net"; throw x; }
  return j;
}

    $("hb-more").replaceChildren(...more); $("hb-more").hidden = !more.length;
  }
  // everyone else: who moves the game on
  const host = V.host ? bn(V.host) : "";
  const key = V.paused || !V.host ? "" : {lobby:"wait_start", collecting:"host_reveals", reveal_review:"wait_confirm", round_result:"wait_next", voided:"wait_replace", game_result:"wait_again", ended:"wait_again"}[ph];
  wait.hidden = isHost() || !key || (g && !g.in && ph !== "lobby" && ph !== "game_result" && ph !== "ended");
  wait.replaceChildren(...(key ? tn(key, {host}) : []));
}

let botT = 0, botKey = "";
const pause = (a, b) => FAST ? 150 + Math.random() * 150 : a + Math.random() * (b - a);
const pick = xs => xs[Math.floor(Math.random() * xs.length)];
function botAnswer(r){
  const bank = BOTBANK[r.prompt.id];
  if (!bank || Math.random() < .08) return pick(["حاجة تانية خالص", "مش عارف والله", "something else", "سر"]) + " " + Math.floor(Math.random() * 90 + 10);
  // the first groups are the likely ones: bots often think alike, and write it differently (that is what the aliases are for)
  const w = bank.map((_, i) => 1 / (i + 1.2)), sum = w.reduce((a, b) => a + b, 0);
  let x = Math.random() * sum, i = 0; while (i < w.length - 1 && (x -= w[i]) > 0) i++;
  return pick(bank[i]);
}
function botTick(){
  if (!V) return;
  const ph = V.phase, c = can(), r = R(), g = G();
  let key = "", run = null, wait = pause(900, 2400);
  if (ph === "lobby" && c.ready){ key = "ready" + V.v; run = () => act("sb_ready"); }
  else if (ph === "collecting" && !V.paused && c.answer && r && !r.mine){
    key = "ans" + r.id; wait = pause(1500, 4000);
    run = () => Math.random() < .05 ? act("sb_skip", {p_round:r.id, p_rev:0}) : act("sb_answer", {p_round:r.id, p_text:botAnswer(r), p_rev:0});
  }
  else if (isHost() && !V.paused){
    const plan = {lobby:c.start && V.members.filter(m => !m.left).length >= WANT ? ["sb_start", null] : null,
      collecting:c.reveal ? ["sb_reveal", {p_round:r && r.id}] : c.few ? ["sb_void", {p_round:r && r.id}] : null,
      reveal_review:c.confirm ? ["sb_confirm", {p_round:r && r.id, p_mrev:r && r.mrev}] : null,
      round_result:c.next ? ["sb_next", {p_round:r && r.id}] : null,
      voided:c.next ? ["sb_next", {p_round:r && r.id}] : null}[ph];
    if (plan){
      key = "host" + ph + V.v; wait = ph === "reveal_review" ? pause(3000, 4500) : ph === "round_result" ? pause(2500, 3500) : pause(1200, 2000);
      run = () => act(plan[0], plan[1]);
    }
  }
  if (!run || key === botKey) return;
  botKey = key; clearTimeout(botT);
  botT = setTimeout(async () => { await run(); setTimeout(() => { if (botKey === key){ botKey = ""; botTick(); } }, 4000); }, wait);
}
// a bot without a seat joins (or opens) the room by itself, under its name
async function botJoin(c){
  const n = QNAME || "بوت";
  try {
    const r = c ? await rpc("sb_join", {p_code:c, p_name:n}) : await rpc("sb_create", {p_name:n});
    saved.name = n; enter(c || r.view.code, r.token, r.view); return true;
  } catch(e){ showStart(c); setMsg($("join-msg"), errT(e.code)); return false; }
}

const hashCode = () => { const m = /^#(\d{5})$/.exec(location.hash); return m ? m[1] : null; };
async function boot(){
  applyLang();
  const c = hashCode();
  if (c && saved.seats[c] && saved.seats[c].token){
    code = c; token = saved.seats[c].token;
    try { setView(await rpc("sb_state", {p_code:c, p_token:token})); connect(); loop(); return; }
    catch(e){ if (LOST.includes(e.code)){ lost(e.code); return; } setNet(false); connect(); loop(); return; }
  }
  if (BOT && (c || CREATE)){ await botJoin(c); return; }
  showStart(c);
}
window.addEventListener("hashchange", () => { const c = hashCode(); if (c && c !== code){ code = null; token = null; V = null; lastJson = ""; if (room){ try { room.close(); } catch(e){} room = null; } boot(); } });
boot();
})();
